syntax = "proto3";

package orchicon.api.v1;

import "google/protobuf/timestamp.proto";

// TenantSecret is a tenant-scoped encrypted secret (API keys etc.).
// The value is write-only: List/Get never return plaintext or ciphertext.
message TenantSecret {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string description = 4;
  int32 key_version = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}
