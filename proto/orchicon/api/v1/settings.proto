syntax = "proto3";

package orchicon.api.v1;

import "google/protobuf/timestamp.proto";

// TenantSettings are the tenant-level configuration defaults stored in the
// control plane database (tenant_settings table). Settings are read by
// services at dispatch time with env-var fallback for dev overrides.
//
// Sections mirror the UI layout:
//   - appearance:    theme/mode (client-side, persisted in localStorage)
//   - defaults:      model refs, stall parameters, budgets, log management
//   - backups:       schedule + retention for automatic snapshots
//   - future:        additional sections as the product grows
message TenantSettings {
  // Default model ref used when a worker version has no model_ref set.
  // If empty, dispatch fails (no hardcoded free-model fallback).
  string default_worker_model = 1;

  // Default model ref for the "Ask Orchicon" feature (placeholder for a
  // future conversational assistant).
  string default_ask_orchicon_model = 2;

  // --- Stall detection defaults ---
  // These are read by the progress monitor at execution dispatch time.
  // Each field has an env-var counterpart that overrides the DB value
  // for dev/debugging (ORCHICON_STALL_*). An empty/zero value means
  // "use the env var or code default".

  // No step_finish or new tokens within this window triggers stalled.
  // Seconds. Default 300 (5 min).
  int64 stall_no_progress_window_seconds = 10;

  // No file modifications within this window triggers stalled.
  // Seconds. Default 900 (15 min). Zero disables.
  int64 stall_no_file_diff_window_seconds = 11;

  // No meaningful action (tool call, file diff, step finish) within this
  // window triggers text-loop stall. Seconds. Default 600 (10 min).
  // Zero disables.
  int64 stall_text_loop_window_seconds = 12;

  // Same tool-call signature repeated this many times within the
  // repetition window triggers repeated-call stall. Default 5.
  // Zero disables.
  int32 stall_repetition_count = 13;

  // Window for repetition detection. Seconds. Default 300 (5 min).
  int64 stall_repetition_window_seconds = 14;

  // --- Nudge knobs (advisory-stall escalation) ---
  // These tune the nudge-first routing: an advisory stall (text_loop /
  // repetition / no_file_progress) nudges the live session first, and only
  // escalates to a fatal kill + recovery after the nudge budget is spent.
  // Each field has an env-var counterpart (ORCHICON_STALL_NUDGE_*). Zero
  // means "use the env var or code default".

  // Max nudges sent to a live session before an advisory stall escalates to
  // a fatal kill + recovery. Default 2.
  int32 stall_nudge_max = 31;

  // How long a nudge waits for the worker to break the pattern before the
  // next trip escalates. Seconds. Default 300 (5 min).
  int64 stall_nudge_reply_window_seconds = 32;

  // Minimum gap between nudges. Seconds. Default 60.
  int64 stall_nudge_cooldown_seconds = 33;

  // --- Execution liveness reaper ---
  // The liveness reaper fails executions whose runtime process is gone
  // (control-plane restart, lost runtime container). The liveness probe
  // can false-negative on a transient docker/socket hiccup, so these two
  // settings govern how cautious the reaper is before it kills an
  // execution. An empty/zero value means "use the env var or built-in
  // default".

  // How long an execution must have been running before it becomes
  // eligible for reaping (skips the fresh-dispatch race). Seconds.
  // Default 60.
  int64 execution_reap_grace_seconds = 15;

  // How many CONSECUTIVE not-alive liveness probes must come back dead
  // before the execution is actually reaped. A single false negative must
  // not kill a healthy execution. Default 3.
  int32 execution_reap_consecutive_failures = 16;

  // --- Execution budget (defaults) ---
  // Default budget JSON applied to executions whose worker does not set its
  // own budget_overrides. Recognized keys: tokens (ALL tokens at full weight
  // including cache), cost_usd (cache-aware priced cost, separate from
  // tokens), wall_clock_seconds, tool_call_count, compact_max_turns, and an
  // optional `warnings` block:
  //   warnings.fractions.<dim> = [warn, escalate, final] as fractions of the
  //     limit (e.g. [0.5, 0.75, 0.9]);
  //   warnings.messages.<dim>  = [warn, escalate, final] message text.
  // The `dim` keys are tokens / cost_usd / tool_call_count /
  // wall_clock_seconds. Every dimension follows the SAME warn → escalate →
  // final → abort ladder: warnings inject escalating messages (+ compact on
  // escalate/final), and the limit is a HARD abort. A worker's explicit
  // budget_overrides overrides these per-field. Empty ({}) means "use the
  // built-in defaults".
  string default_budget_overrides = 19;

  // --- Backup configuration ---

  // Backup schedule in cron expression format (e.g. "0 3 * * *" for daily 3am).
  // Empty means automatic backups are disabled.
  string backup_schedule = 20;

  // Number of days to retain backup snapshots. Older backups are pruned.
  // Zero means keep all backups indefinitely.
  int32 backup_retention_days = 21;

  // Directory where backup snapshots are stored. Empty uses the default
  // (~/.local/share/orchicon/backups/).
  string backup_directory = 22;

  // --- Log management (rotating on-disk logs) ---
  // These drive the serve process's rotating file logger. The serve
  // child reads them from the default tenant at boot and live-applies
  // changes every few seconds (no restart required). An empty/zero value
  // means "use the env var or built-in default".

  // Directory where serve log files are stored. Empty = default
  // (env ORCHICON_LOG_DIR, else .dev/logs).
  string log_directory = 23;

  // Max size of a single log file before it is rotated (MB).
  // Default 100. Zero = default.
  int64 log_max_size_mb = 24;

  // How often the log rolls by time (hours; 24 = daily, 1 = hourly).
  // Default 24. Zero = default.
  int64 log_roll_interval_hours = 25;

  // How many days rotated log files are retained before cleanup.
  // Default 7. Zero = default.
  int32 log_retention_days = 26;

  // Max rotated log files kept on disk (newest kept). Default 7.
  // Zero = default.
  int32 log_max_files = 27;

  // --- Dispatch concurrency (per-project/tenant max-concurrent-runs) ---
  // Cap on how many worker executions may run CONCURRENTLY across the
  // whole tenant. Enforced at dispatch time in the TaskReconciler. A
  // project can override this per-project (Project.max_concurrent_runs);
  // the effective limit for a project is min(tenant, project), where 0 on
  // either side means "no additional restriction from that side". Projects
  // at their cap hold ready items until a running execution frees a slot.
  // Optional so an update can distinguish "set to 0 (no cap)" from
  // "leave unchanged"; absent = unchanged. Zero (default) = no tenant cap.
  optional int32 max_concurrent_runs = 28;

  // --- Session timeout ---
  // Access-token TTL in seconds (how long an access token is valid).
  // Zero = leave unchanged on update. Default is 900 (15 minutes).
  // Range: [30, 86400].
  int64 session_access_token_ttl_seconds = 29;

  // Refresh-token TTL in seconds (how long a refresh token is valid).
  // Zero = leave unchanged on update. Default is 86400 (24 hours).
  // Range: [300, 31536000].
  int64 session_refresh_token_ttl_seconds = 30;

  google.protobuf.Timestamp created_at = 100;
  google.protobuf.Timestamp updated_at = 101;
}
