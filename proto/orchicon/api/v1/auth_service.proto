// Orchicon AuthService.
//
// Manages API keys (hashed, scoped entitlements), identity info,
// RBAC roles + role bindings, and the audit view. OIDC login is
// handled out-of-band via HTTP endpoints (docs/07 §6.1); this service
// manages issued tokens/keys and entitlements (docs/07 §3.12).
syntax = "proto3";

package orchicon.api.v1;

import "google/protobuf/timestamp.proto";
import "orchicon/api/v1/auth.proto";

service AuthService {
  // --- API keys (machine credentials) ---
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse);
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse);
  rpc RotateApiKey(RotateApiKeyRequest) returns (RotateApiKeyResponse);
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse);
  rpc GetApiKey(GetApiKeyRequest) returns (GetApiKeyResponse);

  // --- Identity + entitlements ---
  rpc GetIdentity(GetIdentityRequest) returns (GetIdentityResponse);
  rpc ListIdentities(ListIdentitiesRequest) returns (ListIdentitiesResponse);
  rpc CreateIdentity(CreateIdentityRequest) returns (CreateIdentityResponse);
  rpc UpdateIdentity(UpdateIdentityRequest) returns (UpdateIdentityResponse);
  rpc SetIdentityStatus(SetIdentityStatusRequest) returns (SetIdentityStatusResponse);
  rpc DeleteIdentity(DeleteIdentityRequest) returns (DeleteIdentityResponse);
  rpc ListEntitlements(ListEntitlementsRequest) returns (ListEntitlementsResponse);

  // --- RBAC roles + bindings ---
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);
  rpc ListRoleBindings(ListRoleBindingsRequest) returns (ListRoleBindingsResponse);

  // --- Tenants (admin) ---
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);

  // --- Local-account credentials (embedded IdP boundary) ---
  rpc SetLocalCredential(SetLocalCredentialRequest) returns (SetLocalCredentialResponse);

  // --- Audit ---
  rpc ListAuditEntries(ListAuditEntriesRequest) returns (ListAuditEntriesResponse);
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
}

// ---------------------------------------------------------------------------
// API keys
// ---------------------------------------------------------------------------

message CreateApiKeyRequest {
  string tenant_id = 1;
  string identity_id = 2;
  string name = 3;
  repeated string scopes = 4; // entitlements granted to this key
}
message CreateApiKeyResponse {
  ApiKey api_key = 1;
  ApiKeySecret secret = 2; // plaintext key — shown once
}
message RevokeApiKeyRequest {
  string id = 1;
}
message RevokeApiKeyResponse {
  ApiKey api_key = 1;
}
message RotateApiKeyRequest {
  string id = 1;
}
message RotateApiKeyResponse {
  ApiKey api_key = 1;
  ApiKeySecret secret = 2; // new plaintext key — shown once
}
message ListApiKeysRequest {
  string tenant_id = 1;
  string identity_id = 2; // optional filter
  string page_token = 3;
  int32 page_size = 4;
}
message ListApiKeysResponse {
  repeated ApiKey api_keys = 1;
  string next_page_token = 2;
}
message GetApiKeyRequest {
  string id = 1;
}
message GetApiKeyResponse {
  ApiKey api_key = 1;
}

// ---------------------------------------------------------------------------
// Identity + entitlements
// ---------------------------------------------------------------------------

message GetIdentityRequest {
  string id = 1;
}
message GetIdentityResponse {
  Identity identity = 1;
}
message ListIdentitiesRequest {
  string tenant_id = 1;
  string page_token = 2;
  int32 page_size = 3;
}
message ListIdentitiesResponse {
  repeated Identity identities = 1;
  string next_page_token = 2;
}
// CreateIdentityRequest provisions a new identity (a user or service
// account) in the caller's tenant. Admin-only path: the RBAC interceptor
// gates this to auth:write. For identity_type "user" the subject is the
// login handle (matching the local-account username charset); for
// "service" it is optional — when omitted the server generates a
// synthetic "sa-<ULID>" subject.
message CreateIdentityRequest {
  // Required. "user" | "service".
  string identity_type = 1;
  // Required for "user", optional for "service" (see above).
  string subject = 2;
  // Required. Human-readable name, <= 200 runes.
  string display_name = 3;
}
message CreateIdentityResponse {
  Identity identity = 1;
}
// UpdateIdentityRequest edits an identity's display_name. The optional
// version enables optimistic concurrency: when present and mismatched the
// update fails with NotFound.
message UpdateIdentityRequest {
  string id = 1;
  string display_name = 2;
  optional int32 version = 3;
}
message UpdateIdentityResponse {
  Identity identity = 1;
}
// SetIdentityStatusRequest flips an identity between "active" and
// "disabled". Only those two values are writable; anything else is
// InvalidArgument. The optional version enables optimistic concurrency.
message SetIdentityStatusRequest {
  string id = 1;
  string status = 2; // "active" | "disabled"
  optional int32 version = 3;
}
message SetIdentityStatusResponse {
  Identity identity = 1;
}
// DeleteIdentityRequest hard-deletes an identity plus its role bindings,
// API keys, and local credentials in one tenant-scoped transaction.
// Guarded server-side: the caller cannot delete their own identity, and
// an "active" identity must be disabled first.
message DeleteIdentityRequest {
  string id = 1;
}
message DeleteIdentityResponse {}
message ListEntitlementsRequest {
  string identity_id = 1;
}
message ListEntitlementsResponse {
  repeated Entitlement entitlements = 1;
  bool is_admin = 2; // tenant admin bypasses per-call RBAC checks
}

// ---------------------------------------------------------------------------
// RBAC roles + bindings
// ---------------------------------------------------------------------------

message CreateRoleRequest {
  string tenant_id = 1;
  string name = 2;
  string scope = 3; // "tenant" | "project"
  string scope_ref = 4;
  repeated string entitlements = 5;
}
message CreateRoleResponse {
  Role role = 1;
}
message ListRolesRequest {
  string tenant_id = 1;
  string page_token = 2;
  int32 page_size = 3;
}
message ListRolesResponse {
  repeated Role roles = 1;
  string next_page_token = 2;
}
message AssignRoleRequest {
  string tenant_id = 1;
  string identity_id = 2;
  string role_id = 3;
  string scope = 4;
  string scope_ref = 5;
}
message AssignRoleResponse {
  RoleBinding binding = 1;
}
message RevokeRoleRequest {
  string id = 1; // role_binding id
}
message RevokeRoleResponse {}
message ListRoleBindingsRequest {
  string tenant_id = 1;
  string identity_id = 2; // optional filter
  string page_token = 3;
  int32 page_size = 4;
}
message ListRoleBindingsResponse {
  repeated RoleBinding bindings = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------------------------
// Tenants
// ---------------------------------------------------------------------------

message ListTenantsRequest {
  string page_token = 1;
  int32 page_size = 2;
}
message ListTenantsResponse {
  repeated Tenant tenants = 1;
  string next_page_token = 2;
}
message CreateTenantRequest {
  // Required. Lowercase, kebab-case identifier (e.g. "acme"). Used in
  // API paths and as the unique human-readable key; the id is server-
  // assigned.
  string slug = 1;
  // Required. Display name (e.g. "Acme Corporation").
  string name = 2;
  // Optional. JSON-encoded budget envelope. Defaults to a permissive
  // envelope if empty.
  string budget_envelope_json = 3;
}
message CreateTenantResponse {
  Tenant tenant = 1;
}

// ---------------------------------------------------------------------------
// Local-account credentials (embedded IdP boundary)
// ---------------------------------------------------------------------------

// SetLocalCredential creates or updates the local-account credential bound
// to an identity (upsert by tenant + identity). Admin-only path: the caller
// must hold auth:write (enforced by the RBAC interceptor). The plaintext
// password is hashed with argon2id at the boundary and the stored hash is
// never returned by any RPC or API response.
message SetLocalCredentialRequest {
  // Required. The identity the local credential binds to.
  string identity_id = 1;
  // Required. The login handle the human types (unique per tenant).
  string username = 2;
  // Required. The plaintext password. Hashed at the boundary; never
  // stored, logged, or returned.
  string password = 3;
}
message SetLocalCredentialResponse {
  // The stored credential status ("active"). The hash is intentionally
  // absent.
  string status = 1;
  // The normalized username.
  string username = 2;
}

// ---------------------------------------------------------------------------
// Audit
// ---------------------------------------------------------------------------

message ListAuditEntriesRequest {
  string tenant_id = 1;
  string decision_point = 2; // optional filter
  string actor_id = 3; // optional filter
  string page_token = 4;
  int32 page_size = 5;
}
message ListAuditEntriesResponse {
  repeated AuditEntry entries = 1;
  string next_page_token = 2;
}

// AuditEvent is one row from the audit_events trail (the actor-based
// audit of user actions — the transactional-outbox writer in
// internal/audit). Distinct from AuditEntry (policy decisions): this is
// the "who did what" trail, AuditEntry is the "what did the policy say".
message AuditEvent {
  string id = 1;
  string tenant_id = 2;
  string actor_identity_id = 3; // null when actor_type = system
  string actor_type = 4; // "user" | "system"
  string auth_method = 5; // "oidc"|"apikey"|"local"|"signup"|"dev"|"refresh"|"system"; "" legacy
  string action = 6; // e.g. "work_item.created"
  string target_type = 7; // e.g. "work_item"
  string target_id = 8; // entity ULID
  string before = 9; // JSON snapshot (pre-mutation); "{}" for creates
  string after = 10; // JSON snapshot (post-mutation); "{}" for deletes
  string trace_id = 11;
  google.protobuf.Timestamp occurred_at = 12;
}

message ListAuditEventsRequest {
  string action = 1; // optional exact filter
  string actor_id = 2; // optional filter (actor_identity_id)
  string target_type = 3; // optional exact filter
  string target_id = 4; // optional exact filter
  string page_token = 5; // keyset on (occurred_at, id)
  int32 page_size = 6;
  // Optional inclusive lower bound on occurred_at; absent = unbounded.
  google.protobuf.Timestamp start_time = 7;
  // Optional exclusive upper bound on occurred_at; absent = unbounded.
  google.protobuf.Timestamp end_time = 8;
}
message ListAuditEventsResponse {
  repeated AuditEvent events = 1;
  string next_page_token = 2;
}
