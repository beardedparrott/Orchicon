// Orchicon WorkItem entity (docs/02_Domain_Model.md §2.2).
//
// The work hierarchy is Epic → Feature → Task → Subtask; all four
// share a common WorkItem base. Dependencies are edges in a DAG, not
// parent-child links. Only Tasks and Subtasks are schedulable.
syntax = "proto3";

package orchicon.api.v1;

import "google/protobuf/timestamp.proto";

// WorkItemKind enumerates the work hierarchy kinds (docs/02_Domain_Model.md
// §2.2) plus the typed recovery strategies (PR C — recovery as work
// items). Depth of the regular hierarchy is constrained to 4 levels;
// recovery kinds are schedulable like tasks but route to the
// RecoveryReconciler instead of the TaskReconciler.
//
// Regular: epic → feature → task → subtask.
// Recovery strategies (PR C):
//   - recovery_stop:              abandon the workflow cleanly. Marks
//                                  the linked workflow run failed/aborted.
//   - recovery_summarize_restart:  capture the failure summary, prepend
//                                  to the next attempt's prompt, then
//                                  restart the workflow with that
//                                  expanded context (docs/06 §4).
//   - recovery_human_escalation:  block until a human approves or rejects
//                                  a continuation plan (L3 — docs/06 §7).
//   - recovery_retry_n:           retry the same step up to N times
//                                  before escalating (bounded auto-relax
//                                  per docs/06 §11).
enum WorkItemKind {
  WORK_ITEM_KIND_UNSPECIFIED = 0;
  WORK_ITEM_KIND_EPIC = 1;
  WORK_ITEM_KIND_FEATURE = 2;
  WORK_ITEM_KIND_TASK = 3;
  WORK_ITEM_KIND_SUBTASK = 4;
  WORK_ITEM_KIND_RECOVERY_STOP = 5;
  WORK_ITEM_KIND_RECOVERY_SUMMARIZE_RESTART = 6;
  WORK_ITEM_KIND_RECOVERY_HUMAN_ESCALATION = 7;
  WORK_ITEM_KIND_RECOVERY_RETRY_N = 8;
}

// WorkItem is the base entity of the work hierarchy. All four kinds
// share this shape; only Tasks and Subtasks are schedulable
// (docs/02_Domain_Model.md §2.2).
message WorkItem {
  string id = 1;
  string tenant_id = 2;
  string project_id = 3;
  string parent_id = 4; // empty for top-level (epic)
  WorkItemKind kind = 5;
  string title = 6;
  string description = 7; // Markdown: feeds into the worker's composite prompt as context
  string acceptance_criteria = 8; // Markdown: included in the composite prompt as the task's success definition
  WorkItemStatus status = 9;
  string assigned_worker_ref = 10; // JSON: {worker_id, version} (docs/02 §2.2)
  string workflow_id = 11;
  string workflow_run_id = 22; // active workflow run id (set by WorkflowReconciler on dispatch)
  string workflow_step_id = 23; // active workflow step run id (set by WorkflowReconciler on dispatch)
  google.protobuf.Timestamp scheduled_start_at = 20; // scheduled start for bound runs
  optional bool auto_start_workflow = 21; // true = auto-start on save; false = manual start only; unset defaults to false (opt-in)
  int32 priority = 12;
  string budgets = 13; // JSON: tokens/cost/time (docs/02 §2.2)
  int32 context_window = 14;
  string results = 15; // JSON: execution results
  // PR B (context propagation, PR-A follow-up): composite prompt the
  // worker should see when dispatched. Set by the WorkflowReconciler
  // before dispatch; read by the opencode adapter via the
  // TaskReconciler → manifest Goal. JSONB payload (see migration
  // 20260713210000): {"composite": "# Task\n...\n# Project context\n...\n# Upstream context\n..."}.
  string prompt_context = 19;
  int32 version = 16; // optimistic concurrency (docs/09 §5)
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
  string runtime_image = 24; // runtime container image tag; empty = base image
  // context_files are absolute file OR directory paths selected as worker
  // context, mirroring projects.context_files (docs/10 §3). When a worker
  // is dispatched for this item, these paths are rendered into the
  // composite prompt exactly like the project's context files.
  repeated string context_files = 26;
  // acceptance_review is a human-readable summary of the final work done,
  // auto-populated by the WorkflowReconciler when a bound workflow run
  // reaches a terminal state (docs/02 §2.2). Mirrors acceptance_criteria:
  // markdown, bounded at the API boundary, empty until a run completes.
  // Editable by humans via UpdateWorkItem so auto-generated reviews can be
  // corrected/extended by a reviewer.
  string acceptance_review = 27;
  // sort_order is the sibling order within (parent_id): the sequence
  // engine's derived cursor (architecture-notes/
  // sequential-multi-workflow-runs.md §1). Nullable — only meaningful
  // within a parent (top-level = the parent_id IS NULL group). Changed
  // ONLY by ReorderWorkItems (explicit drag); display sort (ListWorkItems
  // sort_by) never mutates it. NULL sorts last.
  double sort_order = 28;
  // recurring_schedule holds the recurrence definition (frequency, interval,
  // days, start_date, start_time). NULL = not recurring.
  optional RecurringSchedule recurring_schedule = 29;
  // next_run_at is the computed next occurrence of a recurring item, used by
  // the scheduler due-scan. NULL = not recurring or no next occurrence.
  google.protobuf.Timestamp next_run_at = 30;
}

// RecurringSchedule defines the recurrence pattern for a recurring work item.
// Stored as JSONB in the recurring_schedule column. NULL = not recurring.
message RecurringSchedule {
  string frequency = 1;   // minute | hourly | daily | weekly | monthly
  int32 interval = 2;     // >= 1 (e.g. every 2 hours)
  repeated string days = 3; // subset of Mon,Tue,Wed,Thu,Fri,Sat,Sun; empty = every day
  string start_date = 4;  // YYYY-MM-DD (first occurrence date)
  string start_time = 5;  // HH:MM (time of day for occurrences)
}

// WorkItemStatus — schedulable kinds follow:
// pending → ready → assigned → running → checkpointing →
// succeeded | failed | cancelled | recovering (docs/02 §2.2).
// Epics/Features use a subset (pending/succeeded/cancelled).
enum WorkItemStatus {
  WORK_ITEM_STATUS_UNSPECIFIED = 0;
  WORK_ITEM_STATUS_PENDING = 1;
  WORK_ITEM_STATUS_READY = 2;
  WORK_ITEM_STATUS_ASSIGNED = 3;
  WORK_ITEM_STATUS_RUNNING = 4;
  WORK_ITEM_STATUS_CHECKPOINTING = 5;
  WORK_ITEM_STATUS_SUCCEEDED = 6;
  WORK_ITEM_STATUS_FAILED = 7;
  WORK_ITEM_STATUS_CANCELLED = 8;
  WORK_ITEM_STATUS_RECOVERING = 9;
  WORK_ITEM_STATUS_SCHEDULED = 10;
  WORK_ITEM_STATUS_RECURRING = 11;
}

// WorkItemDependency is an edge in the work DAG. The scheduler treats
// the union of edges as a DAG; cycles are rejected at admission
// (docs/02_Domain_Model.md §2.2, docs/09 §3.2).
message WorkItemDependency {
  string id = 1;
  string tenant_id = 2;
  string project_id = 3;
  string from_id = 4; // work item that depends
  string to_id = 5; // work item that is depended upon
  DependencyType type = 6; // blocks | depends_on | relates_to
  google.protobuf.Timestamp created_at = 7;
}

enum DependencyType {
  DEPENDENCY_TYPE_UNSPECIFIED = 0;
  DEPENDENCY_TYPE_BLOCKS = 1;
  DEPENDENCY_TYPE_DEPENDS_ON = 2;
  DEPENDENCY_TYPE_RELATES_TO = 3;
}

// DependencyGraph is the full DAG for a project: nodes (work items)
// and edges (dependencies). Used by the frontend's read-only React
// Flow dependency graph (docs/10).
message DependencyGraph {
  repeated WorkItem nodes = 1;
  repeated WorkItemDependency edges = 2;
}
