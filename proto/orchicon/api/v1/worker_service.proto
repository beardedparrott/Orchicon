// Orchicon WorkerService.
//
// Worker CRUD + versioning lifecycle (publish/deprecate/retire) + edit
// locks for the visual Worker editor (docs/07_API_Specification.md §3.3).
// All mutations write through the transactional outbox
// (docs/09_Database_Schema.md §6). A published Worker is immutable;
// changes create a new version (docs/05_Worker_Specification.md §4).
syntax = "proto3";

package orchicon.api.v1;

import "orchicon/api/v1/worker.proto";
import "orchicon/api/v1/category.proto";

service WorkerService {
  // CreateWorker creates a new Worker in draft state with its first
  // draft version. The version is mutable until published.
  rpc CreateWorker(CreateWorkerRequest) returns (CreateWorkerResponse);

  // PublishWorkerVersion publishes the draft version of a Worker,
  // making it dispatchable. The Worker transitions to published. The
  // version becomes immutable (docs/05 §4).
  rpc PublishWorkerVersion(PublishWorkerVersionRequest) returns (PublishWorkerVersionResponse);

  // DeprecateWorker transitions a published Worker to deprecated. Still
  // dispatchable for in-flight Workflows; no new Workflows may bind
  // (docs/05 §4).
  rpc DeprecateWorker(DeprecateWorkerRequest) returns (DeprecateWorkerResponse);

  // RetireWorker transitions a deprecated Worker to retired. No new
  // dispatches; in-flight executions run to completion (docs/05 §4).
  rpc RetireWorker(RetireWorkerRequest) returns (RetireWorkerResponse);

  // UpdateWorker updates the mutable header fields of a Worker (name,
  // description, purpose). The worker must be in draft status to be
  // updated; published workers must create a new version instead.
  rpc UpdateWorker(UpdateWorkerRequest) returns (UpdateWorkerResponse);

  // DeleteWorker hard-deletes a Worker and all its versions.
  rpc DeleteWorker(DeleteWorkerRequest) returns (DeleteWorkerResponse);

  // DeleteWorkerVersion hard-deletes a single worker version.
  rpc DeleteWorkerVersion(DeleteWorkerVersionRequest) returns (DeleteWorkerVersionResponse);

  // SetActiveWorkerVersion sets a published version as the worker's current
  // version. The worker must be in published status.
  rpc SetActiveWorkerVersion(SetActiveWorkerVersionRequest) returns (SetActiveWorkerVersionResponse);

  // RevertWorkerVersionToDraft moves a published version back to draft so
  // it can be edited. The worker's current_version is not changed; if this
  // version was the active one it remains active until another is published.
  rpc RevertWorkerVersionToDraft(RevertWorkerVersionToDraftRequest) returns (RevertWorkerVersionToDraftResponse);

  // GetWorker returns a single Worker header by id.
  rpc GetWorker(GetWorkerRequest) returns (GetWorkerResponse);

  // ListWorkers returns a page of Workers for the tenant.
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);

  // ListWorkerVersions returns all versions of a Worker, newest first.
  rpc ListWorkerVersions(ListWorkerVersionsRequest) returns (ListWorkerVersionsResponse);

  // GetWorkerVersion returns a single version by its id.
  rpc GetWorkerVersion(GetWorkerVersionRequest) returns (GetWorkerVersionResponse);

  // UpdateWorkerVersion updates the mutable fields of a draft WorkerVersion.
  // Only draft versions can be updated; published versions are immutable.
  rpc UpdateWorkerVersion(UpdateWorkerVersionRequest) returns (UpdateWorkerVersionResponse);

  // CreateWorkerVersion creates a new draft version from the latest
  // published version of a Worker. The new version starts as a draft with
  // all fields copied from the source version.
  rpc CreateWorkerVersion(CreateWorkerVersionRequest) returns (CreateWorkerVersionResponse);

  // AcquireEditLock acquires an exclusive edit lock on a Worker for the
  // visual editor (docs/07 §3.3). Prevents concurrent edits; expires
  // automatically on TTL.
  rpc AcquireEditLock(AcquireEditLockRequest) returns (AcquireEditLockResponse);

  // ReleaseEditLock releases a held edit lock.
  rpc ReleaseEditLock(ReleaseEditLockRequest) returns (ReleaseEditLockResponse);

  // GetEditLock returns the current edit lock state for a Worker, if any.
  rpc GetEditLock(GetEditLockRequest) returns (GetEditLockResponse);

  // BulkUpdateWorkerModel sets model_ref on each requested Worker and
  // publishes the affected version in a single round trip (mirrors the
  // manual edit-then-republish flow but applied atomically per worker).
  // Per-worker outcomes are returned (updated / skipped / error) so
  // partial success is observable. Max 100 ids per call (mirrors
  // BatchDeleteExecutions).
  rpc BulkUpdateWorkerModel(BulkUpdateWorkerModelRequest) returns (BulkUpdateWorkerModelResponse);
}

message CreateWorkerRequest {
  string tenant_id = 1;
  string name = 2;
  string slug = 3;
  string description = 4; // Markdown
  string purpose = 5;
  // First-version snapshot fields (docs/05 §3):
  string runtime_ref = 6;
  string model_ref = 7;
  string system_prompt = 8; // Markdown + template variables (docs/05 §11)
  string context_sources = 9; // JSON
  string permissions = 10; // JSON
  string gated_tools = 11; // JSON
  string budget_overrides = 12; // JSON
  string execution_policy_ref = 13;
  int32 concurrency_limit = 14;
  string recovery_workflow_ref = 15;
  string labels = 16; // JSON
  string version_note = 17;
  string request_id = 18; // idempotency (docs/07 §5.5)
  // Structured prompt fields — when any is set they become the version's
  // source of truth (system_prompt is then composed server-side).
  string role = 19;
  string skills = 20;
  string behavior = 21;
  string agents_md = 22;
  string role_ref = 23; // optional RBAC role binding; empty = no plane access
  // Optional explicit adapter selection (ADR-0005 D2): a validation and
  // consistency affordance for API clients. Must be a Dispatcher-registered
  // kind; when model_ref is also set the two must AGREE (the ref's parsed
  // adapter segment == this value); a lone adapter with no model_ref is
  // rejected — the ref is the only persisted store of the selection.
  string adapter = 24;
}

message CreateWorkerResponse {
  Worker worker = 1;
  WorkerVersion version = 2;
}

message UpdateWorkerRequest {
  string id = 1;
  string name = 2;
  string description = 3; // Markdown
  string purpose = 4;
  // Role binding with presence: set to a role id to bind, "" to clear.
  // Unlike name/description/purpose (draft-only), the role binding is
  // editable on published workers (it lives on the header, not the version).
  optional string role_ref = 5;
}

message UpdateWorkerResponse {
  Worker worker = 1;
}

message PublishWorkerVersionRequest {
  string worker_id = 1;
  string version_note = 2; // optional note for this publish
}

message PublishWorkerVersionResponse {
  Worker worker = 1;
  WorkerVersion version = 2;
}

message DeprecateWorkerRequest {
  string worker_id = 1;
}

message DeprecateWorkerResponse {
  Worker worker = 1;
}

message RetireWorkerRequest {
  string worker_id = 1;
}

message RetireWorkerResponse {
  Worker worker = 1;
}

message DeleteWorkerRequest {
  string id = 1;
}

message DeleteWorkerResponse {}

message DeleteWorkerVersionRequest {
  string worker_id = 1;
  string version_id = 2;
}

message DeleteWorkerVersionResponse {}

message SetActiveWorkerVersionRequest {
  string worker_id = 1;
  int32 version = 2; // the version number to set as active
}

message SetActiveWorkerVersionResponse {}

message RevertWorkerVersionToDraftRequest {
  string version_id = 1;
}

message RevertWorkerVersionToDraftResponse {}

message GetWorkerRequest {
  string id = 1;
}

message GetWorkerResponse {
  Worker worker = 1;
  WorkerVersion latest_version = 2; // latest published version, if any
}

message ListWorkersRequest {
  string tenant_id = 1;
  string page_token = 2;
  int32 page_size = 3;
  optional WorkerStatus status = 4; // optional filter
  string search = 5; // free-text search across name, slug, purpose
  string sort_by = 6; // field name: "name", "status", "created_at" (default)
  string sort_order = 7; // "asc" or "desc" (default "asc")
}

// WorkerListItem is a single row in the workers list — the header plus
// the active version's model_ref and publish state so cards render both
// without an N+1 ListWorkerVersions fetch. The active version is the
// version pinned by workers.current_version when >0, otherwise the
// latest version (highest version number). Mirrors GetWorkerResponse's
// header+version pattern with a minimal projection.
message WorkerListItem {
  Worker worker = 1;
  // active_model_ref is the model_ref of the active version
  // (worker_versions.model_ref) — matches the ModelPicker provider/id
  // format verbatim (e.g. "anthropic/claude-sonnet-4"). Empty when the
  // worker has no versions yet.
  string active_model_ref = 2;
  WorkerVersionStatus active_version_status = 3;
  // active_adapter is the parsed adapter segment of active_model_ref
  // (ADR-0005 D2, computed server-side). Legacy 2-segment refs report
  // the inferred default kind ("opencode") — never a stored value.
  string active_adapter = 4;
}

message ListWorkersResponse {
  repeated Worker workers = 1 [deprecated = true];
  string next_page_token = 2;
  repeated WorkerListItem items = 3;
  repeated Category categories = 4;
  repeated CategoryAssignment assignments = 5;
}

message ListWorkerVersionsRequest {
  string worker_id = 1;
}

message ListWorkerVersionsResponse {
  repeated WorkerVersion versions = 1;
}

message GetWorkerVersionRequest {
  string id = 1; // version id
}

message GetWorkerVersionResponse {
  WorkerVersion version = 1;
}

message UpdateWorkerVersionRequest {
  string worker_id = 1;
  string version_id = 2;
  // Fields to update (only draft versions):
  optional string runtime_ref = 6;
  optional string model_ref = 7;
  optional string system_prompt = 8;
  optional string context_sources = 9;
  optional string permissions = 10;
  optional string gated_tools = 11;
  optional string budget_overrides = 12;
  optional string execution_policy_ref = 13;
  optional int32 concurrency_limit = 14;
  optional string recovery_workflow_ref = 15;
  optional string labels = 16;
  optional string version_note = 17;
  // Structured prompt fields; when any is set the version's system_prompt
  // is recomposed server-side from the four fields.
  optional string role = 18;
  optional string skills = 19;
  optional string behavior = 20;
  optional string agents_md = 21;
  // Optional explicit adapter selection (ADR-0005 D2/D4): validated
  // against the Dispatcher's registered kinds; must agree with model_ref
  // when both are set. When the resulting ref's adapter CHANGES, the new
  // adapter/provider pair must be valid (provider known for the new
  // kind) or the update is rejected InvalidArgument.
  optional string adapter = 22;
}

message UpdateWorkerVersionResponse {
  WorkerVersion version = 1;
}

message CreateWorkerVersionRequest {
  string worker_id = 1;
  // Optional fields to override from the source version.
  optional string runtime_ref = 6;
  optional string model_ref = 7;
  optional string system_prompt = 8;
  optional string context_sources = 9;
  optional string permissions = 10;
  optional string gated_tools = 11;
  optional string budget_overrides = 12;
  optional string execution_policy_ref = 13;
  optional int32 concurrency_limit = 14;
  optional string recovery_workflow_ref = 15;
  optional string labels = 16;
  optional string version_note = 17;
  // Structured prompt fields; when any is set the version's system_prompt
  // is recomposed server-side from the four fields.
  optional string role = 18;
  optional string skills = 19;
  optional string behavior = 20;
  optional string agents_md = 21;
  // Optional explicit adapter selection (ADR-0005 D2/D4) — same contract
  // as UpdateWorkerVersion.
  optional string adapter = 22;
}

message CreateWorkerVersionResponse {
  WorkerVersion version = 1;
}

message AcquireEditLockRequest {
  string worker_id = 1;
  string actor = 2; // identity claiming the lock
}

message AcquireEditLockResponse {
  EditLock lock = 1;
  bool acquired = 2; // false if already held by another actor
}

message ReleaseEditLockRequest {
  string worker_id = 1;
  string actor = 2;
}

message ReleaseEditLockResponse {}

message GetEditLockRequest {
  string worker_id = 1;
}

message GetEditLockResponse {
  EditLock lock = 1; // empty if no lock held
}

// BulkUpdateWorkerModelRequest sets model_ref on every requested Worker
// and publishes the affected version in the same call. The version
// number does NOT advance — the operation mirrors the manual
// edit-then-republish flow (existing draft → edited in place;
// latest published → reverted to draft → edited → republished).
// Max 100 ids per call. Deprecated / retired / not-found workers are
// returned as skipped with a reason; per-worker failures do not abort the
// batch.
message BulkUpdateWorkerModelRequest {
  repeated string worker_ids = 1; // max 100
  string model_ref = 2; // provider/id, e.g. "anthropic/claude-sonnet-4"
}

message BulkUpdateWorkerModelResponse {
  repeated BulkUpdateWorkerModelResult results = 1;
  // Convenience summary for the UI; same numbers the per-worker list
  // produces.
  int32 updated_count = 2;
  int32 skipped_count = 3;
  int32 error_count = 4;
}

// BulkUpdateWorkerModelResult is one worker's outcome. Exactly one of
// updated / skipped / error is set (proto oneof guarantees this).
message BulkUpdateWorkerModelResult {
  string worker_id = 1;
  oneof outcome {
    BulkUpdateWorkerModelUpdated updated = 2;
    BulkUpdateWorkerModelSkipped skipped = 3;
    BulkUpdateWorkerModelError error = 4;
  }
}

// BulkUpdateWorkerModelUpdated is the success outcome: model_ref was
// written to the affected WorkerVersion and the version is now
// published. `version` is unchanged (no fork).
message BulkUpdateWorkerModelUpdated {
  int32 version = 1; // the version number, unchanged
  string model_ref = 2; // echoes the new model_ref for UI confirmation
}

// BulkUpdateWorkerModelSkipped names why this worker was not mutated.
// Deprecated / retired workers cannot be edited via this path; workers
// with zero versions have nothing to edit; not-found is reserved for
// ids that no longer exist.
message BulkUpdateWorkerModelSkipped {
  BulkUpdateWorkerModelSkipReason reason = 1;
}

enum BulkUpdateWorkerModelSkipReason {
  BULK_UPDATE_WORKER_MODEL_SKIP_REASON_UNSPECIFIED = 0;
  BULK_UPDATE_WORKER_MODEL_SKIP_REASON_NOT_FOUND = 1;
  BULK_UPDATE_WORKER_MODEL_SKIP_REASON_DEPRECATED = 2;
  BULK_UPDATE_WORKER_MODEL_SKIP_REASON_RETIRED = 3;
  BULK_UPDATE_WORKER_MODEL_SKIP_REASON_NO_PUBLISHED_VERSION = 4;
}

// BulkUpdateWorkerModelError carries a per-worker failure message for
// the UI; the batch as a whole still returns the full result list.
message BulkUpdateWorkerModelError {
  string message = 1;
}
