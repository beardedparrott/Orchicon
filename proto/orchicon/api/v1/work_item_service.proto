// Orchicon WorkItemService.
//
// WorkItem CRUD + dependency DAG management + worker assignment
// (docs/07_API_Specification.md §3.2). All mutations write through the
// transactional outbox (docs/09_Database_Schema.md §6) and use
// optimistic concurrency via the version column (docs/09 §5).
// Dependency traversal uses a recursive CTE
// (docs/09_Database_Schema.md §11).
syntax = "proto3";

package orchicon.api.v1;

import "google/protobuf/timestamp.proto";
import "orchicon/api/v1/project.proto";
import "orchicon/api/v1/work_item.proto";

service WorkItemService {
  // CreateWorkItem creates a new work item (epic/feature/task/subtask)
  // within a project. Depth is constrained to 4 levels.
  rpc CreateWorkItem(CreateWorkItemRequest) returns (CreateWorkItemResponse);

  // GetWorkItem returns a single work item by id.
  rpc GetWorkItem(GetWorkItemRequest) returns (GetWorkItemResponse);

  // ListWorkItems returns a page of work items for a project, optionally
  // filtered by parent (tree) or status (Kanban).
  rpc ListWorkItems(ListWorkItemsRequest) returns (ListWorkItemsResponse);

  // UpdateWorkItem applies a partial update with optimistic concurrency.
  // Only mutable fields are written (field-mask semantics — docs/07 §5.4).
  rpc UpdateWorkItem(UpdateWorkItemRequest) returns (UpdateWorkItemResponse);

  // DeleteWorkItem soft-deletes a work item (sets status to cancelled).
  rpc DeleteWorkItem(DeleteWorkItemRequest) returns (DeleteWorkItemResponse);

  // HardDeleteWorkItem permanently removes a work item. Cascades to
  // dependencies (work_item_dependencies rows where this item is either
  // the from or to side are deleted). The outbox emits a
  // work_item.purged event. Use this for irreversible removal — the
  // soft DeleteWorkItem is preferred for normal cancellation.
  rpc HardDeleteWorkItem(HardDeleteWorkItemRequest) returns (HardDeleteWorkItemResponse);

  // AddDependency adds an edge to the work DAG. Cycles are rejected at
  // admission (docs/02 §2.2, docs/09 §3.2).
  rpc AddDependency(AddDependencyRequest) returns (AddDependencyResponse);

  // RemoveDependency removes an edge from the work DAG.
  rpc RemoveDependency(RemoveDependencyRequest) returns (RemoveDependencyResponse);

  // GetDependencyGraph returns the full DAG (nodes + edges) for a
  // project. Used by the frontend's read-only React Flow graph (docs/10).
  rpc GetDependencyGraph(GetDependencyGraphRequest) returns (GetDependencyGraphResponse);

  // AssignWorker binds a Worker (id + version) to a Task/Subtask.
  rpc AssignWorker(AssignWorkerRequest) returns (AssignWorkerResponse);

  // UnassignWorker removes the worker binding from a Task/Subtask.
  rpc UnassignWorker(UnassignWorkerRequest) returns (UnassignWorkerResponse);

  // ReorderWorkItems renumbers sort_order for the siblings under parent_id
  // (empty = top level) to the given order, in one transaction. Display
  // sort (ListWorkItems sort_by) never mutates sort_order — only this RPC
  // does. Safe to call while a sequence is running: the sequence cursor is
  // derived from sort_order at reconcile time, so a mid-run drag shifts
  // only future arming.
  rpc ReorderWorkItems(ReorderWorkItemsRequest) returns (ReorderWorkItemsResponse);

  // ArchiveWorkItem hides a terminal work item (succeeded/failed/cancelled/
  // skipped) from every normal view. Blocked when the item has children.
  // Reversible via RestoreWorkItem. Audited as work_item.archived.
  rpc ArchiveWorkItem(ArchiveWorkItemRequest) returns (ArchiveWorkItemResponse);

  // RestoreWorkItem returns an archived work item to the active views,
  // back to the terminal status it was archived from (not pending).
  // Audited as work_item.restored.
  rpc RestoreWorkItem(RestoreWorkItemRequest) returns (RestoreWorkItemResponse);

  // ControlSequence drives a sequence parent manually (START / RESUME /
  // STOP). A parent with children IS a sequence run; these explicit
  // gestures are what the engine's derived cursor cannot infer on its own:
  //   - START re-fires the chain from child #1 (destructive — every
  //     descendant resets to pending); validations + in-flight guards run
  //     server-side.
  //   - RESUME continues from the first non-succeeded child (keeps state).
  //   - STOP parks the chain (parent → pending, schedule cleared) so
  //     children can be run standalone.
  rpc ControlSequence(ControlSequenceRequest) returns (ControlSequenceResponse);
}

// SequenceAction enumerates the manual sequence control gestures.
enum SequenceAction {
  SEQUENCE_ACTION_UNSPECIFIED = 0;
  SEQUENCE_ACTION_START = 1; // re-fire the chain from child #1 (destructive)
  SEQUENCE_ACTION_RESUME = 2; // continue from the first non-succeeded child
  SEQUENCE_ACTION_STOP = 3; // park the chain (parent → pending, schedule cleared)
}

// RecurringFilter scopes ListWorkItems to recurring vs non-recurring items.
// recurring_schedule IS NOT NULL is the canonical is-recurring signal
// (status is derived). This is the split for Automation → Recurring Items.
enum RecurringFilter {
  RECURRING_FILTER_UNSPECIFIED = 0; // legacy default: EXCLUDE for normal callers
  RECURRING_FILTER_ALL = 1; // unfiltered (internal/Schedules merge if needed)
  RECURRING_FILTER_EXCLUDE_RECURRING = 2; // normal Work Items page
  RECURRING_FILTER_ONLY_RECURRING = 3; // Recurring Items page
}

// IdeaScope scopes ListWorkItems to idea-state items produced by
// automations. status = 'idea' is the signal; idea items are excluded from
// the normal Work Items list by default (the Idea Cloud surfaces them via
// IDEA_SCOPE_ONLY_IDEA).
enum IdeaScope {
  IDEA_SCOPE_UNSPECIFIED = 0; // legacy default: EXCLUDE idea items
  IDEA_SCOPE_EXCLUDE_IDEA = 1; // normal Work Items page (default)
  IDEA_SCOPE_ONLY_IDEA = 2; // Idea Cloud: idea-state items with provenance
}

message CreateWorkItemRequest {
  string tenant_id = 1;
  string project_id = 2;
  string parent_id = 3; // empty for top-level (epic)
  WorkItemKind kind = 4;
  string title = 5;
  string description = 6; // Markdown
  string acceptance_criteria = 7; // Markdown
  int32 priority = 8;
  string budgets = 9; // JSON
  int32 context_window = 10;
  string request_id = 11; // idempotency (docs/07 §5.5)
  string workflow_id = 12; // bind to this workflow template; empty = no binding
  google.protobuf.Timestamp scheduled_start_at = 13; // optional scheduled start; null = start immediately if auto_start_workflow
  optional bool auto_start_workflow = 14; // default false when unset (opt-in); set true to start immediately on save
  string runtime_image = 15; // runtime container image tag; empty = base image
  // context_files are absolute file OR directory paths selected as worker
  // context for this item (same model as projects.context_files).
  repeated string context_files = 16;
  // recurring_schedule sets a recurrence pattern; the item's status is
  // automatically flipped to RECURRING on create.
  optional orchicon.api.v1.RecurringSchedule recurring_schedule = 17;
  // depends_on are the IDs of the work items this item depends on. Each ID
  // creates a DEPENDS_ON-type edge (from = this item, to = the listed ID).
  // Absent/empty = no edges. Validated: same project, target exists, no
  // self-dependency, no cycle.
  repeated string depends_on = 18;
}

message CreateWorkItemResponse {
  WorkItem work_item = 1;
}

message GetWorkItemRequest {
  string id = 1;
}

message GetWorkItemResponse {
  WorkItem work_item = 1;
}

message ListWorkItemsRequest {
  string tenant_id = 1;
  string project_id = 2;
  optional string parent_id = 3; // filter by parent (tree view)
  optional WorkItemStatus status = 4; // filter by status (Kanban)
  string search = 5; // free-text search across title and description
  string sort_by = 6; // "title", "priority", "created_at" (default)
  string sort_order = 7; // "asc" or "desc" (default "asc")
  string page_token = 8;
  int32 page_size = 9;
  // include_archived: when false (default), the query returns ONLY active
  // items (archived_at IS NULL) — every normal view uses this default. When
  // true, the query returns ONLY archived items (archived_at IS NOT NULL) —
  // the dedicated archive view sets it. Additive/regression-free: current
  // data has no archived rows, so the default path is byte-for-byte unchanged.
  bool include_archived = 10;
  RecurringFilter recurring_filter = 11;
  // idea_scope filters idea-state items: EXCLUDE (default, matches the
  // legacy UNSPECIFIED) hides automation-produced ideas from every normal
  // view; ONLY returns them (the Idea Cloud surface, with provenance).
  IdeaScope idea_scope = 12;
}

message ListWorkItemsResponse {
  repeated WorkItem work_items = 1;
  string next_page_token = 2;
}

message UpdateWorkItemRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
  optional string acceptance_criteria = 4;
  optional WorkItemStatus status = 5;
  optional int32 priority = 6;
  optional string budgets = 7;
  optional int32 context_window = 8;
  optional string project_id = 10; // reassign to a different project; target must be active
  string request_id = 9;
  optional string workflow_id = 15; // bind/unbind to a workflow template
  optional google.protobuf.Timestamp scheduled_start_at = 16;
  optional bool auto_start_workflow = 17;
  optional string workflow_run_id = 18; // set to empty string to allow re-schedule
  optional string runtime_image = 19; // runtime container image tag; empty = base image
  optional string parent_id = 20; // reparent: empty = clear parent (epic only); unset = unchanged
  // Switch the work item to a different kind (epic/feature/task/subtask).
  // The parent/child hierarchy is resolved automatically in the same
  // transaction (ADR-WIT-2): the item's parent walks up to the nearest
  // ancestor shallower than the new kind, direct children that can no
  // longer sit under the item are reparented to its parent, and switching
  // to a non-schedulable kind (epic/feature) clears the worker binding,
  // scheduled start, and ready/assigned/scheduled status. Unset = unchanged.
  optional WorkItemKind kind = 21;
  // context_files replaces the item's context_files selection: an empty
  // files list clears it, an absent field leaves it unchanged.
  optional ContextFiles context_files = 22;
  // acceptance_review sets the human-readable acceptance review. Empty
  // string clears it; an absent field leaves it unchanged.
  optional string acceptance_review = 23;
  // recurring_schedule sets or clears the recurrence definition. Setting it
  // flips status to RECURRING; clearing it (empty message) resets to
  // non-recurring and clears next_run_at.
  optional orchicon.api.v1.RecurringSchedule recurring_schedule = 24;
  // depends_on replaces the item's outgoing DEPENDS_ON edges (set-replace):
  // an empty ids list clears all edges, an absent field leaves them
  // unchanged. Validated: same project, target exists, no self-dependency,
  // no cycle. Edges are independent of parent_id/sort_order.
  optional DependencyIds depends_on = 25;
}

// DependencyIds is a set of dependency target work item IDs. Used for
// UpdateWorkItem.depends_on so "leave unchanged" (field absent) and
// "clear all" (empty ids) are distinguishable.
message DependencyIds {
  repeated string ids = 1;
}

message UpdateWorkItemResponse {
  WorkItem work_item = 1;
  // Populated when the request explicitly asked auto_start_workflow=true
  // but the server declined to start (the item's status is not one of
  // pending/scheduled/ready/assigned — e.g. cancelled or already
  // finished). The edit itself IS saved; this warning only explains why
  // no run was started. Empty = auto-start was applied (or was never
  // requested).
  string warning = 2;
}

message DeleteWorkItemRequest {
  string id = 1;
}

message DeleteWorkItemResponse {
  WorkItem work_item = 1;
}

message HardDeleteWorkItemRequest {
  string id = 1;
}

message HardDeleteWorkItemResponse {}

message AddDependencyRequest {
  string tenant_id = 1;
  string project_id = 2;
  string from_id = 3; // work item that depends
  string to_id = 4; // work item that is depended upon
  DependencyType type = 5;
  string request_id = 6;
}

message AddDependencyResponse {
  WorkItemDependency dependency = 1;
}

message RemoveDependencyRequest {
  string id = 1; // dependency id
}

message RemoveDependencyResponse {}

message GetDependencyGraphRequest {
  string tenant_id = 1;
  string project_id = 2;
}

message GetDependencyGraphResponse {
  DependencyGraph graph = 1;
}

message AssignWorkerRequest {
  string id = 1; // work item id
  string worker_ref = 2; // JSON: {worker_id, version}
}

message AssignWorkerResponse {
  WorkItem work_item = 1;
}

message UnassignWorkerRequest {
  string id = 1;
}

message UnassignWorkerResponse {
  WorkItem work_item = 1;
}

message ReorderWorkItemsRequest {
  string project_id = 1;
  string parent_id = 2; // empty = top-level siblings
  repeated string child_ids = 3; // the desired sibling order
}

message ReorderWorkItemsResponse {
  repeated WorkItem work_items = 1; // the reordered children, server-confirmed
}

message ControlSequenceRequest {
  string id = 1; // the sequence parent work item id
  SequenceAction action = 2;
}

message ControlSequenceResponse {
  WorkItem work_item = 1; // the parent after the action, server-confirmed
}

// ArchiveWorkItemRequest archives a terminal work item. The request is
// idempotency-free; the work item's current version is read server-side
// (the ArchiveWorkItem RPC re-fetches and bumps it like ArchiveProject),
// so no client version is required.
message ArchiveWorkItemRequest {
  string id = 1;
}

message ArchiveWorkItemResponse {
  WorkItem work_item = 1; // the archived item, server-confirmed
}

// RestoreWorkItemRequest returns an archived work item to the active views.
message RestoreWorkItemRequest {
  string id = 1;
}

message RestoreWorkItemResponse {
  WorkItem work_item = 1; // the restored item, server-confirmed
}
