// Orchicon AskOrchiconService.
//
// Provides the conversational "Ask Orchicon" agent: streaming chat,
// conversation management, attachment upload, and agent configuration.
// The agent can create, read, update, and delete any Orchicon entity,
// answer questions about the platform and user data, diagnose failures,
// and create project directory scaffolding.
syntax = "proto3";

package orchicon.api.v1;

import "orchicon/api/v1/category.proto";
import "orchicon/api/v1/ask_orchicon.proto";
import "orchicon/api/v1/ai_gateway.proto";

service AskOrchiconService {
  // Conversation CRUD.

  // ListConversations returns conversations for the calling tenant,
  // ordered by updated_at descending (most recent first).
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);

  // GetConversation returns a single conversation by id.
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);

  // CreateConversation creates a new conversation. Optionally accepts
  // an initial message to start the conversation immediately.
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);

  // DeleteConversation deletes a conversation and all its messages.
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse);

  // UpdateConversationTitle updates the title of a conversation.
  rpc UpdateConversationTitle(UpdateConversationTitleRequest) returns (UpdateConversationTitleResponse);

  // SetConversationMode switches the active persona for a conversation
  // (Brainstorm | Iteration | Quick Work — see BuildSystemPrompt). The change
  // applies from the NEXT message on: the same opencode session persists and
  // the per-turn system prompt swaps with no session change or serve restart.
  rpc SetConversationMode(SetConversationModeRequest) returns (SetConversationModeResponse);

  // SetConversationModel retargets a conversation's model_ref. The change
  // applies from the NEXT message on; when it changes the ADAPTER segment the
  // bridge is re-resolved for subsequent turns (the serve session is
  // re-established against the new adapter). An EMPTY ref clears the override,
  // so the conversation falls back to the tenant default
  // (default_ask_orchicon_model). This is what lets an operator retarget an
  // already-open chat instead of starting a new one.
  rpc SetConversationModel(SetConversationModelRequest) returns (SetConversationModelResponse);

  // SetConversationProject places a conversation in a PROJECT (or clears it),
  // which is the second, higher level of organization over conversations: the
  // rail and the GUI sidebar list projects as the parent group, every project
  // gets a folder whether or not it has conversations yet, and this rpc is what
  // a drag-into-a-folder or a TUI /project resolves to.
  //
  // A project is the workspace the chat's work happens in — its project_dir is
  // the directory the Ask file/shell suite is scoped to — so setting it also
  // tells the agent WHICH project folder the chat belongs to, and that is what
  // makes all three modes context-aware (see BuildSystemPrompt). An EMPTY
  // project_id unassigns the conversation. An unknown id is rejected: a
  // conversation can be unassigned, but it can never point at a project that
  // does not exist.
  rpc SetConversationProject(SetConversationProjectRequest) returns (SetConversationProjectResponse);

  // Messages.

  // ListMessages returns messages for a conversation, ordered by
  // created_at ascending (oldest first).
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);

  // ChatStream sends a message (with optional attachments) to a
  // conversation and returns immediately with a TurnStarted ack carrying
  // the assistant message id under which the reply will be persisted. The
  // reply is collected on a request-independent context (bounded by the
  // reply window) and delivered by polling ListMessages — a browser
  // disconnect or tab close never cancels or loses it. The TextChunk /
  // ReasoningChunk / ToolCallResult / ErrorChunk / DoneSignal events are
  // retained for a future SSE surface but are not emitted by the current
  // implementation.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE — ChatStreamResponse is
  // deliberately shared with InterjectConversationTurn (the interject stream
  // is the same oneof: TextChunk / ReasoningChunk / TurnStarted).
  rpc ChatStream(ChatStreamRequest) returns (stream ChatStreamResponse);

  // AbortConversationTurn aborts the in-flight turn on a conversation's
  // opencode session (the Stop button). The session itself is kept alive
  // for the next message — only the running turn is cancelled, and the
  // collector persists a user-initiated-stop error message under the acked
  // assistant message id. Idempotent: aborting a conversation with no
  // running turn is a no-op.
  rpc AbortConversationTurn(AbortConversationTurnRequest) returns (AbortConversationTurnResponse);

  // InterjectConversationTurn sends a message that SUPERSEDES an in-flight
  // turn (the chat equivalent of a worker-execution nudge, but with an
  // interrupt): the current turn's collector is cancelled, the
  // conversation's opencode session is aborted so the model stops generating
  // NOW, and the interjection is dispatched on a fresh turn that ack a new
  // assistant message id and streams TextChunk / ReasoningChunk events live.
  // The superseded turn's partial content is persisted as a plain assistant
  // message (skipped entirely when nothing arrived). Idempotent: interjecting
  // a conversation with no running turn behaves exactly like ChatStream.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE — the interject stream is the
  // same ChatStreamResponse oneof as ChatStream (TextChunk / ReasoningChunk /
  // TurnStarted); reusing the type is deliberate.
  rpc InterjectConversationTurn(InterjectConversationTurnRequest)
      returns (stream ChatStreamResponse);

  // WatchTurnStream re-attaches to an ACKED turn's live event stream after
  // the ChatStream socket dropped (network blip, server restart,
  // backgrounded tab) WITHOUT dispatching a new turn. The server looks up
  // the conversation's in-flight turn in the turn registry and replays
  // subsequent TextChunk / ReasoningChunk / Heartbeat events to this
  // stream; if no turn is running (or the assistant message id does not
  // match the running turn), it returns NotFound and the client falls back
  // to the ListMessages completion poll. Stale generations never clobber:
  // the client opens this under its dispatch-gen guards and ignores chunks
  // once the poll resolves the turn.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE — the watch stream is the
  // same ChatStreamResponse oneof as ChatStream; reusing the type is
  // deliberate.
  rpc WatchTurnStream(WatchTurnStreamRequest) returns (stream ChatStreamResponse);

  // ReplyPermissionAsk answers a PermissionAsk the turn is waiting on. The
  // decision applies to OUR grant store: PERMISSION_CHOICE_ALLOW_ONCE proceeds for this single
  // call, PERMISSION_CHOICE_ALLOW_SESSION records an in-memory, directory-keyed grant for this
  // conversation, DENY refuses the call (the refusal reaches the model as the
  // tool result). The value sent to the serve is always `once` or `reject` —
  // never a session-scoped serve value.
  rpc ReplyPermissionAsk(ReplyPermissionAskRequest) returns (ReplyPermissionAskResponse);

  // CompactConversation compacts a conversation's accumulated context so a
  // long-running session can keep going instead of failing on the model's
  // context limit. Adapter-scoped: a session-FUL adapter summarizes its own
  // session in place (opencode POST /session/{id}/summarize); a SESSIONLESS
  // adapter (native) reduces the history it would re-send and replaces it
  // with a summary plus the most recent turns.
  //
  // This is the escape hatch for a conversation already past its window: the
  // sessionless transport re-sends the full history every turn, so once the
  // history exceeds the window EVERY subsequent send fails and the
  // conversation is permanently wedged. Compaction is the only way back.
  //
  // reason is recorded for the audit trail and the transcript marker:
  // "manual" (a user asked), "pressure" (the proactive window gate fired),
  // or "reactive" (a provider context-limit error was caught).
  rpc CompactConversation(CompactConversationRequest) returns (CompactConversationResponse);

  // Attachments.

  // UploadAttachment uploads a file attachment for use in a message.
  // Returns a URL that can be referenced in subsequent ChatStream calls.
  rpc UploadAttachment(UploadAttachmentRequest) returns (UploadAttachmentResponse);

  // Agent configuration.

  // GetAgentConfig returns the Ask Orchicon agent configuration for
  // the calling tenant.
  rpc GetAgentConfig(GetAgentConfigRequest) returns (GetAgentConfigResponse);

  // UpdateAgentConfig updates the Ask Orchicon agent configuration.
  rpc UpdateAgentConfig(UpdateAgentConfigRequest) returns (UpdateAgentConfigResponse);

  // Model capabilities.

  // GetModelCapabilities returns the capabilities of a specific model
  // (text-only vs multi-modal), so the frontend can adapt the UI.
  rpc GetModelCapabilities(GetModelCapabilitiesRequest) returns (GetModelCapabilitiesResponse);
}

// --- Conversations ---

message ListConversationsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
  string next_page_token = 2;
  repeated Category categories = 3;
  repeated CategoryAssignment assignments = 4;
}

message GetConversationRequest {
  string id = 1;
}

message GetConversationResponse {
  Conversation conversation = 1;
}

message CreateConversationRequest {
  string model_ref = 1;
  string initial_message = 2;
  // mode is the starting persona. Unset/UNSPECIFIED defaults to BRAINSTORM.
  ConversationMode mode = 3;
  // project_id is the project this conversation belongs to. Empty creates an
  // unassigned conversation; the GUI's per-project "new conversation" button
  // and the TUI's create-in-folder both set it. An unknown id is rejected.
  string project_id = 4;
}

message CreateConversationResponse {
  Conversation conversation = 1;
}

message SetConversationModeRequest {
  string id = 1;
  ConversationMode mode = 2;
}

message SetConversationModeResponse {
  Conversation conversation = 1;
}

message SetConversationModelRequest {
  string id = 1;
  // model_ref is canonical adapter/provider/model (ADR-0003); a legacy
  // 1/2-segment ref is accepted and infers adapter "opencode". Empty clears
  // the per-conversation override so the tenant default applies.
  string model_ref = 2;
}

message SetConversationModelResponse {
  Conversation conversation = 1;
}

message SetConversationProjectRequest {
  string id = 1;
  // project_id is the project to place the conversation in. Empty UNASSIGNS it
  // (the conversation survives, it just leaves the project folder). A non-empty
  // id must name an existing project.
  string project_id = 2;
}

message SetConversationProjectResponse {
  Conversation conversation = 1;
}

message DeleteConversationRequest {
  string id = 1;
}

message DeleteConversationResponse {}

message UpdateConversationTitleRequest {
  string id = 1;
  string title = 2;
}

message UpdateConversationTitleResponse {
  Conversation conversation = 1;
}

// --- Messages ---

message ListMessagesRequest {
  string conversation_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListMessagesResponse {
  repeated ChatMessage messages = 1;
  string next_page_token = 2;
}

// --- Chat Streaming ---

message ChatStreamRequest {
  string conversation_id = 1;
  string message = 2;
  repeated AttachmentInput attachments = 3;
}

message ChatStreamResponse {
  oneof event {
    TextChunk text_chunk = 1;
    ToolCallChunk tool_call_start = 2;
    ToolCallResult tool_call_result = 3;
    ErrorChunk error = 4;
    DoneSignal done = 5;
    TurnStarted turn_started = 6;
    ReasoningChunk reasoning = 7;
    Heartbeat heartbeat = 8;
    // PermissionAsk carries a permission.asked the turn is waiting on: the
    // tool, the target path(s) or command, the directory a session grant
    // would cover, and a one-line summary. It reaches both the live dispatch
    // stream and every re-attached WatchTurnStream watcher. The answer comes
    // back on ReplyPermissionAsk.
    PermissionAsk permission_ask = 9;
  }
}

// TurnStarted is the immediate ack for a ChatStream send: the message was
// persisted and the turn is in flight. The reply is persisted under
// assistant_message_id and delivered by polling ListMessages.
message TurnStarted {
  string assistant_message_id = 1;
}

// AbortConversationTurnRequest identifies the conversation whose running
// turn should be aborted.
message AbortConversationTurnRequest {
  string conversation_id = 1;
}

message AbortConversationTurnResponse {}

// WatchTurnStreamRequest identifies the running turn to re-attach to: the
// conversation plus the assistant message id ACKED by the original
// ChatStream TurnStarted. Both must match the registry entry or the RPC
// fails with NotFound (no clobber across supersedes).
message WatchTurnStreamRequest {
  string conversation_id = 1;
  string assistant_message_id = 2;
}

// InterjectConversationTurnRequest identifies the conversation to interject
// and carries the steering message. The message replaces (supersedes) the
// in-flight turn and is answered on a fresh turn; attachments are optional.
message InterjectConversationTurnRequest {
  string conversation_id = 1;
  string message = 2;
  repeated AttachmentInput attachments = 3;
}

// CompactConversationRequest identifies the conversation to compact.
message CompactConversationRequest {
  string conversation_id = 1;
  // reason records WHY the compaction happened: "manual", "pressure", or
  // "reactive". Free-form and advisory; recorded verbatim in the audit trail.
  string reason = 2;
}

// CompactConversationResponse reports the outcome of a compaction. It is a
// synchronous result (not a stream): compaction is a single bounded operation
// and the caller needs only the verdict plus the reason when it declined.
message CompactConversationResponse {
  // compacted is false when nothing was done — an empty history, or a
  // history already small enough that a lossy collapse would cost detail for
  // no benefit. detail always says why.
  bool compacted = 1;
  // detail is a one-line, user-facing explanation of the outcome (shown
  // verbatim in the transcript marker and the composer notice).
  string detail = 2;
  // summary is the generated summary text that replaced the collapsed
  // history. Empty when compacted is false.
  string summary = 3;
  // context_tokens_before / context_tokens_after are the conversation's
  // prompt size around the compaction — MEASURED only. 0 means "unknown":
  // this field is never populated from an estimate (an estimate is reported
  // in detail instead), so a caller can trust a non-zero value as real.
  int64 context_tokens_before = 4;
  int64 context_tokens_after = 5;
}

// --- Attachments ---

message UploadAttachmentRequest {
  string conversation_id = 1;
  string name = 2;
  string mime_type = 3;
  bytes data = 4;
}

message UploadAttachmentResponse {
  string attachment_id = 1;
  string url = 2;
}

// --- Agent Config ---

message GetAgentConfigRequest {}

message GetAgentConfigResponse {
  AgentConfig config = 1;
}

message UpdateAgentConfigRequest {
  AgentConfig config = 1;
}

message UpdateAgentConfigResponse {
  AgentConfig config = 1;
}

// --- Model Capabilities ---

message GetModelCapabilitiesRequest {
  string model_ref = 1;
}

message GetModelCapabilitiesResponse {
  ModelCapabilities capabilities = 1;
}

// --- Consent ---

// PermissionAsk is one tool call the turn is blocked on, awaiting the
// operator's decision. It always names the action: the tool plus either the
// target path(s) or the shell command — never just an opaque id.
message PermissionAsk {
  string ask_id = 1;
  string conversation_id = 2;
  string session_id = 3;
  // tool is the opencode permission name ("write" | "edit" | "batch_write" |
  // "bash").
  string tool = 4;
  // command is the shell command line, for a bash ask (empty otherwise).
  string command = 5;
  // targets are the paths a write/edit touches (empty for bash).
  repeated string targets = 6;
  // directory is the grant/deny key: the target's directory for a write/edit,
  // the cwd for bash. "Allow for this directory" covers exactly this key.
  string directory = 7;
  // inside_project reports whether the action already falls inside the
  // conversation's own project directory (the default, pre-approved scope).
  bool inside_project = 8;
  // summary is the one-line card text: tool plus target or command.
  string summary = 9;
}

// PermissionChoice is the operator's answer to one ask.
enum PermissionChoice {
  PERMISSION_CHOICE_UNSPECIFIED = 0;
  // PERMISSION_CHOICE_ALLOW_ONCE proceeds for this single call; the same call asks again.
  PERMISSION_CHOICE_ALLOW_ONCE = 1;
  // PERMISSION_CHOICE_ALLOW_SESSION records an in-memory directory grant for the conversation.
  PERMISSION_CHOICE_ALLOW_SESSION = 2;
  // PERMISSION_CHOICE_DENY refuses the call; the refusal reaches the model as the tool result.
  PERMISSION_CHOICE_DENY = 3;
}

message ReplyPermissionAskRequest {
  string conversation_id = 1;
  string ask_id = 2;
  PermissionChoice choice = 3;
}

// ReplyPermissionAskResponse reports whether the decision was applied.
message ReplyPermissionAskResponse {
  // applied is true when the decision was routed to the waiting turn.
  bool applied = 1;
  // expired is true when the ask is no longer open (the turn ended, was
  // superseded, or another reply won) — never a silent success.
  bool expired = 2;
  // detail explains the outcome in one line.
  string detail = 3;
}
