<!doctype html>
<!-- The PRE-HYDRATION theme: this attribute is what the browser paints BEFORE the app's theme store runs,
     so it must name the same theme the store defaults to (theme-store.ts DEFAULT_DARK_THEME) or a fresh
     load flashes the old dark theme for a frame and then switches — the one moment the setting is visible
     as a change rather than as the default. Both name Teal Depths now. -->
<html lang="en" class="dark" data-theme="orchicon-dark-teal">
  <head>
    <meta charset="UTF-8" />
    <!-- The favicon is the brand mark: adaptive ink (dark on a light browser chrome, light #EDEDE6 on a
         dark one) via a prefers-color-scheme <style> block INSIDE the SVG, so one file serves both. Safari
         ignores CSS in SVG favicons and renders the dark-ink default. Before this, the comment promised the
         adaptation but the file carried fill="currentColor" with no style — browser defaulting rendered the
         arrows black everywhere. The favicon replaces a reference to `/vite.svg` — Vite's scaffold default,
         which never existed on disk — so before favicon.svg landed the app had none at all: every page load
         404'd. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orchicon</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
