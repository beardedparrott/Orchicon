# Loki — log backend for the Orchicon single-container image.
# @DATA_DIR@ is replaced with the container data dir at startup.
auth_enabled: false

server:
  http_listen_port: 3100
  # Offset the gRPC listener from the default 9095 (which collides with
  # another process in the single-container network namespace).
  grpc_listen_port: 9096

common:
  path_prefix: "@DATA_DIR@/loki"
  storage:
    filesystem:
      chunks_directory: "@DATA_DIR@/loki/chunks"
      rules_directory: "@DATA_DIR@/loki/rules"
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Retention: prune log data older than this window so the telemetry
  # volume cannot grow unbounded (Loki's default is NO retention).
  # 336h = 14 days, matching Tempo's trace retention.
  retention_period: 336h
  allow_structured_metadata: true
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          regex: .*
    scope_attributes:
      - action: structured_metadata
        regex: .*
    log_attributes:
      - action: structured_metadata
        regex: .*

# The compactor performs the actual retention deletion. Without this block
# retention_period above is inert (Loki requires retention_enabled +
# delete_request_store, and a working_directory for the compactor).
compactor:
  working_directory: "@DATA_DIR@/loki/compactor"
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem
