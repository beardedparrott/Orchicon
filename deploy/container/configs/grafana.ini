# Grafana config for the Orchicon single-container image.
# Sub-path + anonymous auth come from env (GF_SERVER_*) set by the
# supervisor, so the public root_url can differ per instance (dev :8080,
# prod :8091) without rebuilding the image.
[server]
http_port = 3000

[paths]
data = @DATA_DIR@/grafana
logs = @DATA_DIR@/grafana/logs
provisioning = @DATA_DIR@/config/grafana-provisioning

[log]
mode = console
level = warn
