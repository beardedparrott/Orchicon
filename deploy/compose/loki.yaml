# Loki — log aggregation backend (Grafana stack).
# Single-binary monolithic mode: filesystem storage (TSDB index + chunks),
# OTLP HTTP ingest on :3100/otlp (maps resource attributes to labels, so
# orchicon.tenant_id / service.name become stream labels).
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /var/loki
  storage:
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          regex: .*
    scope_attributes:
      - action: structured_metadata
        regex: .*
    log_attributes:
      - action: structured_metadata
        regex: .*
