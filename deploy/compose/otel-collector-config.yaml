# OTel collector config for the Orchicon telemetry plane.
#
# Receives OTLP (gRPC + HTTP) from the control plane and frontend,
# fan-outs to the Grafana stack: traces → Tempo, logs → Loki, metrics
# → VictoriaMetrics (Prometheus remote write). Telemetry is fully
# separated from control state (docs/01 §3, docs/08 §5). The control
# plane never owns this infrastructure.
#
# Per docs/08 §5.1, canonical spans include api.<service>.<rpc>,
# reconcile.<kind>.<id>, dispatch.<task_id>, adapter.execute.*,
# recovery.*, and gateway.* — all flow through this collector.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000
  memory_limiter:
    check_interval: 2s
    limit_percentage: 80
    spike_limit_percentage: 25

exporters:
  # Traces → Tempo (OTLP HTTP).
  otlphttp/tempo:
    endpoint: http://tempo:4318
    tls:
      insecure: true
  # Logs → Loki (OTLP HTTP endpoint).
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  # Metrics → VictoriaMetrics (Prometheus remote write).
  # add_metric_suffixes=false keeps the canonical orchidicon_* metric names
  # (the exporter would otherwise append _total to counters and _<unit> for
  # unit-bearing instruments). resource_to_telemetry_conversion adds the
  # resource attributes (service.name, orchicon.tenant_id) as series labels
  # so tenant-scoped PromQL queries work.
  prometheusremotewrite:
    endpoint: http://victoriametrics:8428/api/v1/write
    add_metric_suffixes: false
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
