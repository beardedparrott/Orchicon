# Grafana provisioning — dashboards for the Orchicon telemetry stack.
# The Orchicon dashboard is embedded in the Telemetry page (kiosk mode,
# anonymous Viewer role) so users get a real observability dashboard
# without signing into Grafana (docs/10 §11).
apiVersion: 1

providers:
  - name: orchicon
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
