# Grafana provisioning — datasources for the Orchicon telemetry stack.
# Referenced by uid from the frontend embed deep-links (see
# frontend/src/routes/telemetry.tsx GrafanaEmbed): tempo, loki, victoriametrics.
apiVersion: 1

datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: victoriametrics

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000

  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
