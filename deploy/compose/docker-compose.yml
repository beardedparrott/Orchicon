# Docker Compose for Orchicon local development stack.
# Services: postgres, nats, otel-collector, tempo, loki, victoriametrics, grafana
# Usage: docker compose -f deploy/compose/docker-compose.yml up -d

services:
  # PostgreSQL — primary state store (control plane + tenant data).
  postgres:
    image: postgres:16-alpine
    container_name: orchicon-postgres
    environment:
      POSTGRES_USER: orchicon
      POSTGRES_PASSWORD: orchicon
      POSTGRES_DB: orchicon
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchicon -d orchicon"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # NATS JetStream — event bus for outbox relay, telemetry streams, webhooks.
  nats:
    image: nats:2.10-alpine
    container_name: orchicon-nats
    command: ["-js", "-sd", "/data/jetstream", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data/jetstream
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # OTel collector — receives OTLP from the control plane, fan-outs to
  # Tempo (traces), Loki (logs), VictoriaMetrics (metrics).
  # NOTE: the official otel-contrib image is distroless (no shell), so
  # this service has no healthcheck — the control plane's OTel SDK uses a
  # non-blocking dial and degrades gracefully if the collector is down.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    pull_policy: missing
    container_name: orchicon-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    environment:
      LOW_MEMORY_MODE: "true"
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    restart: unless-stopped

  # Tempo — trace backend. OTLP ingest (internal), query API on :3200.
  tempo:
    image: grafana/tempo:2.7.1
    pull_policy: missing
    container_name: orchicon-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # query API (control plane + Grafana)
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3200/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Loki — log backend. OTLP ingest on :3100/otlp, query API on :3100.
  loki:
    image: grafana/loki:3.4.2
    pull_policy: missing
    container_name: orchicon-loki
    # The loki image runs as uid 10001 by default, but the named volume is
    # root-owned; run as root so the ruler/chunks directories are writable.
    user: "0"
    command: ["-config.file=/etc/loki.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki.yaml:ro
      - loki-data:/var/loki
    ports:
      - "3100:3100"   # query + OTLP ingest (control plane + Grafana)
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3100/ready >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # VictoriaMetrics — metric backend (PromQL). Remote-write ingest + query.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.111.0
    pull_policy: missing
    container_name: orchicon-victoriametrics
    command: ["-retentionPeriod=720h"]
    volumes:
      - victoriametrics-data:/victoria-metrics-data
    ports:
      - "8428:8428"   # query + remote-write (control plane + Grafana)
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8428/health"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Grafana — observability UI. Served same-origin by the control plane
  # under /grafana (serve_from_sub_path), so the embedded iframe in the
  # Telemetry page works in all deployment modes.
  grafana:
    image: grafana/grafana:11.5.2
    pull_policy: missing
    container_name: orchicon-grafana
    environment:
      # Sub-path serving: Grafana generates every URL with the /grafana
      # prefix, which the control plane /grafana reverse proxy strips.
      # root_url must be the public origin of the control plane (dev:
      # http://localhost:8080). Anonymous Viewer so the embedded iframe
      # needs no auth (docs/08 §5).
      GF_SERVER_ROOT_URL: "http://localhost:8080/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana-provisioning/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  nats-data:
  tempo-data:
  loki-data:
  victoriametrics-data:
  grafana-data:
