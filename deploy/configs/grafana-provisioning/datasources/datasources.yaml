# Grafana provisioning — datasources for the Orchicon supervised service set.
# The backend URLs carry @…_PORT@ tokens because the ports are per-instance on a
# host (see tempo.yaml's header); writeConfigs substitutes the resolved table.
apiVersion: 1

datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://localhost:@TEMPO_HTTP_PORT@
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: victoriametrics

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://localhost:@LOKI_HTTP_PORT@
    jsonData:
      maxLines: 1000

  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://localhost:@VM_HTTP_PORT@
    isDefault: true
