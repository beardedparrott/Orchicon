# Orchicon develop version-bump workflow.
#
# Keeps the version tag strictly monotonic so a rebuild (via `git describe
# --tags`; see Makefile + internal/version) always reports the current code.
# This — not a manual `git tag -a v0.1.<next>` — is now the canonical
# per-merge version tick: every time `develop` advances, we tag the exact
# new tip commit with the next `v0.1.x` (patch+1 over the highest existing
# version tag) and push it.
#
# Why `push` to develop (not pull_request_target): a merged/squashed PR lands
# as exactly one new commit on develop, so GITHUB_SHA is precisely the commit
# to tag. `pull_request_target` checks out the base branch and cannot reliably
# identify "the merge commit" when two merges race.
#
# Why this does NOT publish a release:
#   - A tag pushed via the default GITHUB_TOKEN does not re-trigger the
#     `push: tags` workflow (the same GITHUB_TOKEN-recursion limitation
#     auto-release.yml documents — it is why that workflow uses
#     workflow_dispatch). So `release.yml` does not run from this push.
#   - `release.yml`'s guard independently skips any tag not reachable from
#     `main`, so a develop bump tag pushed before the human cuts a release is
#     never treated as a release.
#   - Only the human's `develop` → `main` merge carrying the `release` label
#     (auto-release.yml) publishes a release.
#
# Version continuity with releases: auto-release bumps from the highest tag
# too, so a human release lands one past the last develop bump and develop
# resumes from there — one monotonic v0.1.x sequence.
#
# --- RIDING THE CURRENT TAG: [NoDevBump] --------------------------------------
#
# A merge whose commit message contains `[NoDevBump]` does NOT mint a NEW version.
# It rides whatever tag is already highest.
#
# WHY. This workflow tags EVERY merge to develop, and auto-release computes the
# release number from the same pool of tags. So intermediate work consumes release
# numbers before the release exists: v0.6.1, v0.6.3 and v0.6.4 were all minted by
# fix PRs and never published, which is why the actual release kept landing on a
# number nobody wanted.
#
# NOT TAGGING AT ALL WOULD NOT HAVE HELPED. next_tag refuses to reuse a tag that
# sits on a different commit — it bumps past it — so an untagged merge simply makes
# the NEXT merge climb anyway. One opt-out has to cover every merge between
# releases, or the counter keeps moving.
#
# So the marker makes the merge SHARE the current tag instead. Two commits, one
# version, no number consumed. That is safe here because the tag means "which
# version is this tree", not "which commit": local builds report it, auto-release
# computes from it, and release builds get it passed explicitly via -ldflags rather
# than read from tag placement.
#
# Put `[NoDevBump]` in the PR TITLE for any merge that should ride the current
# version: documentation-only PRs, and post-release fixes that will ship with the
# next release rather than as their own.
#
# THE MARKER MUST BE IN THE TITLE, because the title is what survives both ways a
# PR lands here: a SQUASH merge uses it as the commit subject, a MERGE COMMIT puts
# it in the body. Matching the whole commit message covers both.

name: Develop Bump

on:
  push:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: develop-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # THE OPT-OUT IS CHECKED FIRST, so a skipped merge cannot tag and leave a
      # half-written state behind. It reads the merge commit's FULL message: a squash
      # merge carries the PR title as its subject, a merge commit carries it in the body.
      - name: Check for [NoDevBump]
        id: skip
        run: |
          set -euo pipefail
          MSG="$(git log -1 --format='%B' "${GITHUB_SHA}")"
          if printf '%s' "$MSG" | grep -qF '[NoDevBump]'; then
            latest="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
            if [ -z "$latest" ]; then
              # Nothing to ride. Tagging this commit is strictly better than leaving the
              # whole history untagged.
              echo "ride=false" >> "$GITHUB_OUTPUT"
              echo "::warning::[NoDevBump] found but there is no version tag to ride — tagging normally."
            else
              echo "ride=true" >> "$GITHUB_OUTPUT"
              echo "ride_tag=${latest}" >> "$GITHUB_OUTPUT"
              echo "::notice::[NoDevBump] — this merge rides ${latest} instead of minting a new version."
              printf '%s\n' "$MSG" | head -3
            fi
          else
            echo "ride=false" >> "$GITHUB_OUTPUT"
          fi

      # THE MERGE RIDES THE CURRENT TAG: point that tag at this commit, moving it
      # forward so `git describe` resolves for a build of the current tree. The tag
      # MOVES, which is why this is a force-push of a tag — safe here because the
      # old commit keeps the same version by definition (it was the same release
      # cycle) and nothing keys on tag-to-commit identity. If the force-push is
      # rejected, the version is still correct; only `git describe` is staler.
      - name: Ride the current version tag
        if: steps.skip.outputs.ride == 'true'
        env:
          RIDE_TAG: ${{ steps.skip.outputs.ride_tag }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${RIDE_TAG}" "${GITHUB_SHA}"
          if git push --force origin "refs/tags/${RIDE_TAG}"; then
            echo "Moved ${RIDE_TAG} to ${GITHUB_SHA:0:12} — this merge rides it."
          else
            echo "::warning::could not move ${RIDE_TAG}; the version is unchanged and still correct, " \
                 "only \`git describe\` reports the previous commit."
          fi

      - name: Bump version tag
        id: bump
        if: steps.skip.outputs.ride != 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          TARGET_SHA="${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          next_tag() {
            local latest
            latest="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
            if [ -z "$latest" ]; then
              echo "v0.1.0"
              return
            fi
            local maj min pat
            maj="$(echo "$latest" | sed 's/^v//' | cut -d. -f1)"
            min="$(echo "$latest" | sed 's/^v//' | cut -d. -f2)"
            pat="$(echo "$latest" | sed 's/^v//' | cut -d. -f3)"
            echo "v${maj}.${min}.$((pat + 1))"
          }

          for attempt in 1 2 3 4; do
            # Always recompute from the latest remote tags so a concurrent
            # develop merge (serialized by the concurrency group) or a racing
            # human release cut cannot make us claim an already-taken version.
            git fetch --tags --force origin >/dev/null 2>&1 || true
            NEW_TAG="$(next_tag)"

            existing="$(git rev-parse -q --verify "refs/tags/${NEW_TAG}" 2>/dev/null || true)"
            if [ -n "$existing" ]; then
              existing_commit="$(git rev-parse "${NEW_TAG}^{}")"
              if [ "$existing_commit" = "$TARGET_SHA" ]; then
                echo "Tag ${NEW_TAG} already points at ${TARGET_SHA}; nothing to do."
                echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Tag ${NEW_TAG} already exists at ${existing_commit:0:12}; bumping past it (attempt ${attempt})."
              continue
            fi

            if ! git tag "${NEW_TAG}" "${TARGET_SHA}" 2>/dev/null; then
              echo "Could not create ${NEW_TAG} (already exists); retrying (attempt ${attempt})."
              continue
            fi
            if git push origin "refs/tags/${NEW_TAG}"; then
              echo "Created and pushed ${NEW_TAG} at ${TARGET_SHA:0:12}"
              echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push of ${NEW_TAG} failed — likely collided with a tag from a concurrent run; retrying (attempt ${attempt})."
            git tag -d "${NEW_TAG}" 2>/dev/null || true
          done

          echo "::error::Could not create a fresh version tag after 4 attempts (persistent collision)."
          exit 1
