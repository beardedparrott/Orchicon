name: Canary

# CANARY — THE DEVELOP INSTALL PATH.
#
# WHY THIS EXISTS. The installers are the one artifact a USER exercises before we do, and that has cost us
# twice: a broken installer reached two published releases in a row, and the first detector was an operator
# running one by hand. `install-path` (see ci.yml) now drives the POSIX installer end to end against a real
# artifact, but it is deliberately offline and has no WSL2 — so it cannot cover the WINDOWS path, which is
# exactly where both faults were.
#
# SO THIS PUBLISHES WHAT A DEVELOP TEST NEEDS: the current develop code, built into the release's EXACT
# asset shape, on a moving `canary` PRERELEASE. An operator can then run the REAL installer from develop
# against REAL artifacts, on their own machine, before anything is released.
#
# IT IS NOT A RELEASE, and being a prerelease is what makes that true mechanically: `releases/latest` —
# which both installers resolve when no version is given — never sees a prerelease, so the normal install
# path is untouched. release.yml is unaffected too: it triggers on `v*.*.*` tags reachable from main, and
# `canary` is neither.
#
# THE ASSET NAMES ARE STABLE — `orchicon_canary_<os>_<arch>.tar.gz`, no version number — so the command
# below is a fixed string rather than something to look up after every merge. `canary` IS the version:
# both installers build `<base>/<version>/orchicon_<version>_<os>_<arch>.tar.gz` and strip a leading `v`,
# so `canary` resolves to exactly these names.
#
# WINDOWS ALSO CARRIES THE DESKTOP APP (the `desktop-windows` job below):
#   orchicon_canary_windows_amd64.msi                          per-user MSI, CLI + TUI + desktop
#   orchicon_desktop_canary_windows_amd64_installer.exe        the NSIS installer alone
#   orchicon_desktop_canary_windows_amd64.zip                  portable desktop app
# Those stems carry `canary` for the same reason the archives do — install.ps1 builds the name it will
# fetch from `<version>`, so a version number in the name would break the fixed command. The MSI's
# ProductVersion is the one thing that cannot be `canary` (it must be numeric); see the Build the MSI
# step for why it is 0.0.<run number> rather than a fixed 0.0.0.
#
#   Windows (PowerShell):
#     $env:ORCHICON_INSTALL_BASE_URL = "https://github.com/beardedparrott/Orchicon/releases/download"
#     & ([scriptblock]::Create((irm https://raw.githubusercontent.com/beardedparrott/Orchicon/develop/scripts/install.ps1))) -Version canary
#
#   Linux / macOS:
#     ORCHICON_INSTALL_BASE_URL="https://github.com/beardedparrott/Orchicon/releases/download" \
#       bash -c "$(curl -fsSL https://raw.githubusercontent.com/beardedparrott/Orchicon/develop/scripts/install.sh)" -- --version canary
#
# (The base URL is already the default, so setting it is belt-and-braces — it is named here so the command
# keeps working if that default ever moves.)
#
# TO TEST THE INSTALLER SCRIPT AGAINST A RELEASED VERSION, drop the version flag: the script still comes
# from develop — which is the point, since the script is what has broken — and the artifacts come from the
# latest release. That covers changes to the script without needing a canary at all.
#
# KEEP THE MATRIX AND THE PACKAGING IN STEP WITH release.yml. They are duplicated rather than shared
# because release.yml IS the release path and a reusable-workflow refactor of it is a poor trade for four
# lines; TestCanaryMatchesReleaseMatrix (cmd/orchicon) fails if the platform sets drift apart.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  # NO `packages: write`: this workflow publishes BINARIES only. The single-container
  # image (and the job that pushed it) is retired — there is no instance image to
  # keep in step with a canary, and the per-workflow runtime base image is built and
  # pushed by release.yml alone.

# One at a time, newest wins: a canary is a moving pointer at develop's tip, so an older run finishing
# later would overwrite it with older code.
concurrency:
  group: canary
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # THE FRONTEND MUST BE BUILT BEFORE THE BINARY, and this is not tidiness.
      #
      # The frontend is embedded with `//go:embed all:frontend/dist`, and `frontend/dist/.gitkeep` is tracked
      # EXACTLY SO THE EMBED ALWAYS HAS A TARGET. So a job that skips the frontend build COMPILES PERFECTLY
      # and produces a valid archive whose binary serves NO UI AT ALL — the embed matched .gitkeep and
      # nothing else. Nothing fails; the defect is only visible to whoever installs it and opens the URL.
      #
      # That is what happened: a canary install replaced a working host plane with a binary that had no
      # frontend, and the browser got `{"error":"missing credentials"}` — the request fell through to the
      # auth-guarded catch-all because there was no static asset to serve. release.yml builds the frontend
      # here, and this is the same shape.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      # The SAME build and package shape as release.yml's Package step, with the version replaced by the
      # literal `canary` — a canary whose archive is shaped differently from a release would test a
      # different extraction path than the one that ships, which is how a test stops meaning anything.
      - name: Build and package
        run: |
          set -euo pipefail
          LDFLAGS="-X github.com/beardedparrott/orchicon/internal/version.gitCommit=$(git rev-parse --short HEAD) \
                   -X github.com/beardedparrott/orchicon/internal/version.gitTag=canary \
                   -X github.com/beardedparrott/orchicon/internal/version.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export CGO_ENABLED=0
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then EXT=".exe"; fi
          GOOS="${{ matrix.os }}" GOARCH="${{ matrix.arch }}" go build -ldflags "$LDFLAGS" -o "orchicon${EXT}" ./cmd/orchicon
          GOOS="${{ matrix.os }}" GOARCH="${{ matrix.arch }}" go build -ldflags "$LDFLAGS" -o "orch${EXT}" ./cmd/orch
          ASSET="orchicon_canary_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p "$ASSET"
          cp "orchicon${EXT}" "orch${EXT}" "$ASSET/"
          cp README.md LICENSE "$ASSET/" 2>/dev/null || true
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -r "${ASSET}.zip" "$ASSET"
            ls -l "${ASSET}.zip"
          else
            tar -czf "${ASSET}.tar.gz" "$ASSET"
            ls -l "${ASSET}.tar.gz"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: canary-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            orchicon_*.tar.gz
            orchicon_*.zip
          if-no-files-found: error

  # THE DESKTOP APP IS PART OF THE DEVELOP INSTALL PATH, so canary builds it too.
  #
  # WHY THIS JOB EXISTS. Without it, canary published the CLI and the TUI only, and the
  # sole place an MSI had ever been built was a pull-request CI run: an artifact that
  # expires, hangs off a branch that then gets deleted, and is therefore not an install
  # path an operator can be handed. Canary exists precisely so a REAL installer is
  # exercised against DEVELOP before anything is released — and for a Windows operator
  # "the installer" now includes the desktop app.
  #
  # IT MIRRORS release.yml's `desktop-windows` ON PURPOSE, down to the pinned Wails and
  # WiX versions and the asset stems. A canary whose artifacts are SHAPED differently
  # from a release tests a different upgrade and extraction path than the one that
  # ships, which is how a test quietly stops meaning anything. The ONE thing that must
  # differ is the MSI's own Version property — see the Build step.
  desktop-windows:
    name: Desktop — Windows (MSI + NSIS installer + portable zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          cd frontend && npm ci && npm run build

      - name: Install the pinned Wails CLI
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # NSIS IS WHAT `-nsis` ACTUALLY RUNS, AND IT IS NOT ON THE RUNNER IMAGE.
      #
      # Wails shells out to makensis. When it is absent it prints
      #   Warning: Cannot create installer: makensis not found
      # and EXITS 0 — so the build step goes green and the installer simply is not
      # produced. Found exactly that way: the first run that ever built it failed one
      # step later, in the naming step, with "no NSIS installer found".
      #
      # Chocolatey is preinstalled on the hosted Windows runners. Its PATH change does
      # not reach this session, so the directory is exported for the NEXT step, which is
      # where makensis is first used.
      - name: Install NSIS (makensis)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis -y --no-progress

          # FIND makensis RATHER THAN ASSUMING ITS DIRECTORY.
          #
          # This appended the literal "C:\Program Files (x86)\NSIS". That is where nsis 3.12 put it, and it
          # worked until it did not: on 2026-10-23 the same step installed nsis 3.13.0 successfully and the NEXT
          # step still could not find makensis, so the job failed with "makensis is not on PATH" while the log
          # plainly said the install had succeeded. A hardcoded path cannot survive a package that relocates.
          $found = Get-ChildItem -Path "C:\Program Files (x86)\NSIS","C:\Program Files\NSIS" -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) {
            Write-Host "makensis: $($found.FullName)"
            Split-Path -Parent $found.FullName | Out-File -FilePath $env:GITHUB_PATH -Append
          } else {
            Write-Host "makensis.exe not found after installing nsis"
          }

      # `-webview2 download` embeds the WebView2 Evergreen bootstrapper in the NSIS
      # installer, so a Windows 10 machine provisions itself on first run instead of
      # opening a blank window. Same flags as the release.
      - name: Build the app + NSIS installer
        shell: bash
        run: |
          set -euo pipefail
          # FAIL LOUDLY WHEN MAKENSIS IS MISSING. Without this the `wails` invocation
          # below exits 0 having produced no installer, which is a green build that
          # shipped nothing — the same shape as the frontend `.gitkeep` embed.
          # RESOLVE IT HERE AS WELL: a $GITHUB_PATH append from the step above did not reach this one
          # on 2026-10-23, so the job failed claiming the install was missing while the log showed it
          # working. Adding the plausible directories costs nothing and makes this step independent of a
          # mechanism we cannot observe from here.
          # ${PATH} rather than $PATH: on purpose. The workflow tokeniser (windows_msi_test.go's
          # TestWorkflowPwshStepsParse) applies PowerShell's "$name:" rule to every step, and `$PATH:`
          # is a hard parse error THERE — so the brace form keeps a bash line from tripping a pwsh rule.
          export PATH="${PATH}:/c/Program Files (x86)/NSIS:/c/Program Files/NSIS:/c/ProgramData/chocolatey/bin"
          if ! command -v makensis >/dev/null 2>&1; then
              echo "error: makensis is not on PATH — the 'Install NSIS (makensis)' step is missing or failed."
              echo "       `wails -nsis` only WARNS without it and exits 0, so this assert is what makes it loud."
              exit 1
          fi
          cd cmd/orchicon-desktop
          wails build -clean -platform windows/amd64 -webview2 download -nsis \
            -ldflags "-X github.com/beardedparrott/orchicon/internal/version.gitTag=canary"
          # AND ASSERT THE ARTIFACT, not just the exit code: a present makensis that still
          # emitted nothing is the same silent-degradation shape.
          shopt -s nullglob
          inst=(build/bin/*installer*.exe)
          if [ ${#inst[@]} -eq 0 ]; then
            echo "error: wails build -nsis produced no installer in build/bin although makensis was on PATH."
            ls -l build/bin
            exit 1
          fi
          echo "installer: ${inst[0]}"

      # THE MSI NEEDS THE CLI BINARIES TOO. Built here rather than downloaded from the
      # `build` job: that job publishes a .zip, and unzipping it to reach two .exe files
      # would couple this packaging step to the archive layout for no gain. The ldflags
      # match the `build` job's exactly, so a canary from the MSI and a canary from the
      # zip report the same version rather than differing by how they were packaged.
      - name: Build the Windows CLI binaries (they go IN the MSI)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          LDFLAGS="-X github.com/beardedparrott/orchicon/internal/version.gitCommit=$(git rev-parse --short HEAD) \
                   -X github.com/beardedparrott/orchicon/internal/version.gitTag=canary \
                   -X github.com/beardedparrott/orchicon/internal/version.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o bin/orchicon.exe ./cmd/orchicon
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o bin/orch.exe ./cmd/orch

      # PINNED BELOW 6, for the reason release.yml gives: WiX v6+ requires accepting the
      # Open Source Maintenance Fee EULA, and an unpinned install resolves to v7 and fails
      # with "error WIX7015". cmd/orchicon/windows_msi_test.go holds every workflow and the
      # Makefile to the same pin.
      - name: Install the WiX CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      # `-ext` does NOT restore from NuGet — it resolves through WiX's own extension
      # store, so the extension must be installed first (WIX0144 otherwise). Its own step
      # because the PATH export above only takes effect in the NEXT step.
      - name: Install the WiX UI extension
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          wix extension add -g WixToolset.UI.wixext/5.0.2

      # THE VERSION IS THE ONE THING THAT CANNOT MIRROR THE RELEASE, twice over:
      #
      #  1. AN MSI VERSION MUST BE NUMERIC. WiX rejects the ProductVersion "canary" —
      #     the property is major.minor.build (major and minor ≤ 255, build ≤ 65535) —
      #     so the tag cannot travel into it.
      #  2. IT MUST STILL INCREASE. A fixed 0.0.0 would make every canary the SAME
      #     product version, and the .wxs declares <MajorUpgrade>, so reinstalling after
      #     the next merge would not upgrade anything — Windows would either report
      #     "already installed" or leave the previous build in place, which is precisely
      #     the re-test canary exists to make possible.
      #
      # `github.run_number` is monotonic per workflow and unique per run, so successive
      # canaries always order above each other. It stays far below the 65535 ceiling.
      # The ASSET NAME keeps `canary`, because that is what install.ps1 probes for
      # (`orchicon_<version>_windows_<arch>.msi`, version digits never included).
      - name: Build the MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = "dist/msi-src"
          $null = New-Item -ItemType Directory -Force -Path $src, dist/desktop
          Copy-Item bin/orchicon.exe $src/
          Copy-Item bin/orch.exe $src/
          Copy-Item cmd/orchicon-desktop/build/bin/orchicon-desktop.exe $src/
          Copy-Item deploy/desktop/windows/README-WINDOWS.txt $src/
          Copy-Item deploy/desktop/windows/LICENSE.rtf $src/
          Copy-Item deploy/desktop/windows/orchicon-desktop.ico $src/
          # THE WIZARD ART (WixUIBannerBmp / WixUIDialogBmp reach it via $(var.SourceDir)).
          Copy-Item deploy/desktop/windows/wizard-banner.bmp $src/
          Copy-Item deploy/desktop/windows/wizard-dialog.bmp $src/
          $srcAbs = (Resolve-Path $src).Path
          wix build deploy/desktop/windows/Orchicon.wxs -arch x64 -ext WixToolset.UI.wixext `
            -d "Version=0.0.${{ github.run_number }}" -d "SourceDir=$srcAbs" -bindvariable "WixUILicenseRtf=$srcAbs\LICENSE.rtf" `
            -o "dist/desktop/orchicon_canary_windows_amd64.msi"
          Get-ChildItem dist/desktop
          # THE LICENSE PAGE TEXT MUST BE IN THE PACKAGE — asserted on the BYTES, because the
          # flag that puts it there is easy to get subtly wrong and twice did: as an MSI
          # Property (never read) and as a -d preprocessor variable (never read either, because
          # the dialog declares a BIND variable). Both times the build succeeded and the wizard
          # silently kept WiX's lorem-ipsum placeholder. A check that knows nothing about flags
          # cannot be fooled by them.
          $msiFile = Get-Item "dist/desktop/orchicon_canary_windows_amd64.msi"
          $bytes = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($msiFile.FullName))
          if ($bytes -notmatch [regex]::Escape("beardedparrott")) {
            throw "the license page text is NOT in the MSI: WixUILicenseRtf did not reach the dialog (use -bindvariable, not -d)."
          }
          if ($bytes -match "Lorem ipsum") {
            throw "the MSI still contains WiX's lorem-ipsum placeholder license text."
          }
          Write-Host "license page text is in the package, and no placeholder remains"

      # The stems carry `canary` for the same reason the .tar.gz/.zip assets do: the name
      # is a fixed string an operator does not have to look up, and `install.ps1 -Desktop
      # -Version canary` builds exactly this name. The portable zip does NOT carry the
      # WebView2 bootstrapper (an unzip cannot run an installer), so it ships
      # README-WINDOWS.txt naming the Evergreen URL instead.
      # THE BURN BUNDLE: the wizard a PERSON runs. It wraps the MSI built above, so it has to
      # come after it. `wix extension add` is required for the Bal extension for the same
      # reason as the UI one: -ext resolves through WiX's own store, not NuGet.
      - name: Install the WiX Bal extension (for the bundle)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2

      - name: Build the Burn bundle (OrchiconSetup.exe)
        shell: pwsh
        env:
          ORCHICON_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path "dist/desktop/orchicon_canary_windows_amd64.msi").Path
          $src = (Resolve-Path "dist/msi-src").Path
          wix build deploy/desktop/windows/OrchiconSetup.wxs -ext WixToolset.BootstrapperApplications.wixext `
            -d "Version=0.0.${{ github.run_number }}" -d "MsiPath=$msi" -d "LicenseRtf=$src\LICENSE.rtf" `
            -outputtype bundle -o "dist/desktop/OrchiconSetup_canary_windows_amd64.exe"
          Get-Item "dist/desktop/OrchiconSetup_canary_windows_amd64.exe" | ForEach-Object {
            Write-Host "bundle: $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)" }

      - name: Name the desktop artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bins = Get-ChildItem -Path cmd/orchicon-desktop/build/bin -Filter *.exe -File
          $installer = $null
          $app = $null
          foreach ($f in $bins) {
            if ($f.Name -match 'installer') { $installer = $f } elseif ($null -eq $app) { $app = $f }
          }
          if ($null -eq $installer) { throw "no NSIS installer found in desktop/build/bin — wails build -nsis did not produce one" }
          if ($null -eq $app) { throw "no desktop executable found in desktop/build/bin" }
          $null = New-Item -ItemType Directory -Force -Path dist/desktop
          Copy-Item $installer.FullName "dist/desktop/orchicon_desktop_canary_windows_amd64_installer.exe"
          $stage = "stage/orchicon_desktop_canary_windows_amd64"
          $null = New-Item -ItemType Directory -Force -Path $stage
          Copy-Item $app.FullName "$stage/orchicon-desktop.exe"
          Copy-Item deploy/desktop/windows/README-WINDOWS.txt "$stage/README-WINDOWS.txt"
          Compress-Archive -Path $stage -DestinationPath "dist/desktop/orchicon_desktop_canary_windows_amd64.zip"
          Get-ChildItem dist/desktop

      # NAMED `canary-*` so the publish job's existing `pattern: canary-*` collects it —
      # a differently-named artifact would build here and never reach the release, the
      # "built and silently not published" failure this file's ASSETS list guards against.
      - uses: actions/upload-artifact@v4
        with:
          name: canary-windows-desktop
          path: dist/desktop/*
          if-no-files-found: error

  # THE macOS DESKTOP APP, SO A MAC CAN TEST THE SAME THING A WINDOWS BOX CAN.
  #
  # The canary published the CLI and the TUI only, so `install.sh` on a Mac fell through to
  # "the desktop app is not in release canary" — the installer did the right thing and the
  # release simply had nothing to give it. A platform where the develop install path silently
  # halves is not a platform anyone can test.
  #
  # NOT SIGNED, NOT NOTARISED, AND THAT IS THE HONEST TRADE. Signing needs the Developer ID
  # certificate and the Apple notary credentials, which live in the release path only. So
  # Gatekeeper will refuse this .app and the tester opens it with right-click -> Open. The same
  # .app WITH those secrets is what release.yml's desktop-macos job produces; this is the
  # develop-buildable half, and it is stated plainly in README-WINDOWS.txt's macOS sibling.
  desktop-macos:
    name: Desktop — macOS (.app, UNSIGNED canary)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          set -euo pipefail
          cd frontend && npm ci && npm run build

      - name: Install the pinned Wails CLI
        run: |
          set -euo pipefail
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # universal = one .app for Apple Silicon and Intel, which is why the asset is named
      # ..._darwin_universal.zip rather than per-arch. Same name install.sh resolves.
      - name: Build the .app
        run: |
          set -euo pipefail
          cd cmd/orchicon-desktop
          wails build -platform darwin/universal -clean             -ldflags "-X github.com/beardedparrott/Orchicon/internal/version.gitTag=canary"

      - name: Package it the way the release does
        run: |
          set -euo pipefail
          mkdir -p dist/desktop
          app="$(find cmd/orchicon-desktop/build/bin -maxdepth 1 -name '*.app' -type d | head -1)"
          if [ -z "$app" ]; then echo "wails produced no .app"; exit 1; fi
          stage="stage/orchicon_desktop_canary_darwin_universal"
          mkdir -p "$stage"
          cp -R "$app" "$stage/"
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "dist/desktop/orchicon_desktop_canary_darwin_universal.zip"
          ls -lh dist/desktop

      - uses: actions/upload-artifact@v4
        with:
          name: canary-macos-desktop
          path: dist/desktop/*.zip
          if-no-files-found: error

  publish:
    # BOTH JOBS, or a failed desktop build publishes a canary pointing at NEW code with
    # the PREVIOUS merge's installer: `gh release upload --clobber` replaces matching
    # names and leaves everything else, so the two would sit under one tag claiming to be
    # the same commit. A canary that lies about its own contents is worse than no canary.
    # BOTH DESKTOP JOBS ARE GATES.
    #
    # macOS started outside `needs` on purpose: its wails -platform darwin/universal build had
    # never run, and letting an unproven job block the canary would have cost a Windows test
    # round. It has now built and published once, so it gates like Windows does — a publish after
    # a failed desktop build would otherwise leave the previous merge's artifacts under a tag
    # claiming to be this commit.
    needs: [build, desktop-windows, desktop-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: canary-*
          merge-multiple: true
          path: dist

      - name: Publish the canary prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l dist
          # Move the tag onto the commit being published, so the prerelease provably points at the code it
          # carries, and `git describe` on that commit names it.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f canary "$GITHUB_SHA"
          git push -f origin canary

          NOTES=$(cat <<'EOF'
          The current state of **develop**, built into the release asset shape so the REAL installer can be
          exercised before anything is released. **Not a release** — a prerelease, so `releases/latest`
          never resolves to it.

          Assets are rebuilt on every merge to develop, and their names are stable, so this command does
          not change:

          ```
          Windows:  & ([scriptblock]::Create((irm https://raw.githubusercontent.com/beardedparrott/Orchicon/develop/scripts/install.ps1))) -Version canary
          POSIX:    curl -fsSL https://raw.githubusercontent.com/beardedparrott/Orchicon/develop/scripts/install.sh | bash -s -- --version canary
          ```

          The version of the code inside is whatever develop was at the tag — check the commit on this
          release's tag.

          **Windows now also carries the desktop app**, so the develop install path is the same shape a
          release publishes:

          - `orchicon_canary_windows_amd64.msi` — per-user installer (CLI + TUI + desktop app, Start
            menu and desktop shortcuts). `install.ps1 -Version canary` prefers it automatically.
          - `orchicon_desktop_canary_windows_amd64_installer.exe` — the NSIS installer on its own.
          - `orchicon_desktop_canary_windows_amd64.zip` — portable desktop app, no installer.

          The MSI's own version is `0.0.<run number>`, not `canary`: an MSI ProductVersion must be
          numeric, and it must still increase so each rebuild upgrades the previous one rather than
          colliding with it. The file name is the stable part.
          EOF
          )

          if gh release view canary >/dev/null 2>&1; then
            gh release upload canary dist/*.tar.gz dist/*.zip dist/*.msi dist/*.exe --clobber
            gh release edit canary --prerelease --title "canary (develop)" --notes "$NOTES"
          else
            gh release create canary --prerelease --title "canary (develop)" --notes "$NOTES" \
              dist/*.tar.gz dist/*.zip dist/*.msi dist/*.exe
          fi
          gh release view canary --json tagName,isPrerelease -q '"published " + .tagName + " prerelease=" + (.isPrerelease|tostring)'
