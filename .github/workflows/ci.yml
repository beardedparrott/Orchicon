name: CI

# Standing CI for the Multi-adapter gate. Runs the control-plane gate on
# every PR targeting `develop` so the no-synthesized-data audit (and the
# rest of `make ci`) is actually standing, plus the frontend linter.
#
# `make ci` = lint gen vet test synth-data rls-check. `synth-data` (the
# ADR-0010 no-synthesized-data audit) is the gate this workflow exists to
# make permanent: a new synthesized-data fallback in non-test source fails
# the build.
#
# Notes:
#   - gen/lint need buf (installed below) and the frontend node_modules for
#     the local protoc-gen-es / protoc-gen-connect-es plugins, so the
#     frontend deps are installed BEFORE `make ci`.
#   - rls-check (scripts/check-rls.sh) needs a MIGRATED Postgres: on an
#     empty database the gate is vacuous (zero tables = zero violations),
#     so the go-ci job runs a Postgres service and applies the Atlas
#     migrations (via `go run tools/atlas-ci` — no atlas binary on the
#     runner) before `make ci` with DB_URL exported.
#   - Hermetic CI: bare runners never install adapter CLIs (opencode
#     today, claude code etc. tomorrow). The opencode adapter's
#     binary-resolution seam is stubbed by its tests instead — the
#     fail-fast tests exercise the real paths with nothing provisioned.

on:
  pull_request:
    branches: [develop]

jobs:
  go-ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orchicon
          POSTGRES_PASSWORD: orchicon
          POSTGRES_DB: orchicon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orchicon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_URL: postgres://orchicon:orchicon@localhost:5432/orchicon?sslmode=disable

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install buf (protobuf lint + gen)
        run: |
          tool_dir="$(go env GOPATH)/bin"
          go install github.com/bufbuild/buf/cmd/buf@latest
          echo "$tool_dir" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps (protoc-gen-es + lint)
        run: cd frontend && npm ci

      - name: Apply migrations (make rls-check non-vacuous)
        run: go run ./tools/atlas-ci

      - name: Run control-plane gate (make ci)
        run: make ci

  fe-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Lint frontend
        run: make fe-lint
