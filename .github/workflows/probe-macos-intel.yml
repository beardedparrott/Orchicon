# TEMPORARY PROBE — delete before merge.
#
# Question: is the `macos-26-intel` runner label AVAILABLE TO THIS REPOSITORY?
#
# Why it is worth a whole workflow: the canary's macOS job starved on `macos-26` (arm64) — queued, never
# acquired a runner, cancelled after 15m01s with zero steps, which skipped `publish` and left the canary three
# merges behind. GitHub's runner-images table lists `macos-26-intel` as the x64 label for the SAME macOS 26
# image, which would keep the Xcode/SDK pin and dodge the starved arm64 pool — but that label sits in the
# table alongside the `-large` family, so it may be a LARGER (paid) runner this repo is not entitled to.
#
# A label the repo cannot use fails in seconds, so this asks directly and costs one tiny job. If it provisions,
# the canary switches to it; if it is rejected, the answer is "keep macos-26 and handle capacity differently",
# and no release workflow was changed on a guess.
name: probe-macos-intel

on:
  pull_request:
    paths:
      - .github/workflows/probe-macos-intel.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-26-intel
    steps:
      - name: Report the host
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
