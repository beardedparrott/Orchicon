# Orchicon release workflow.
#
# Builds the control-plane binary for Linux, macOS, and Windows (amd64
# + arm64), packages them as tar.gz/zip with the naming convention the
# install scripts expect, and creates a GitHub Release. The frontend is
# built and embedded so the binary serves the SPA in production mode
# (docs/10 §9). Triggers on version tags (v*.*.*).
#
# The install scripts (scripts/install.sh, scripts/install.ps1) download
# these release assets. When a phase adds new runtime components that
# need to ship in the binary, update the build step here and verify the
# install scripts still work end-to-end (AGENTS.md §Install Scripts).
#
# Every release also publishes a SHA256SUMS file covering the archives, and
# BOTH installers verify the download against it before extracting — so a
# truncated or substituted archive fails the install instead of being
# installed. Generating the file is only half of it: the upload manifest is
# the `find` in the Create GitHub Release step, and TestReleasePublishesChecksums
# pins both halves.
#
# The macOS artifacts are signed and notarised ONLY when a Developer ID
# certificate exists. The `sign-macos` job below is that dormant path, and its
# header states the cost and the secret/variable names it needs. Until it is
# enabled the release ships unsigned archives, and the installers' guidance
# block is the supported story (the curl one-liner is Gatekeeper-clean; a
# browser download needs one `xattr` command).

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.2.0)'
        required: true

permissions:
  contents: write
  packages: write
  # The final "Dispatch release pruning" step calls `gh workflow run
  # prune-releases.yml`, which requires the `actions: write` scope on the
  # GITHUB_TOKEN — without it the dispatch 403s and the release cap is
  # never enforced.
  actions: write

jobs:
  guard:
    name: Guard — release only for main tags
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag is a release (reachable from main)
        id: check
        run: |
          set -e
          # Manual dispatches (from auto-release.yml, which runs with
          # --ref main) are always legitimate releases.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Tag-push runs: only tags reachable from `main` are releases.
          # develop carries its own bump tags (v0.1.x) so local rebuilds
          # report the current version — those must NOT publish a release.
          TAG="${{ github.ref_name }}"
          if git merge-base --is-ancestor "$TAG" "refs/remotes/origin/main" 2>/dev/null; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} is reachable from main — proceeding with release."
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag ${TAG} is not reachable from main — this is a develop bump tag, not a release. Skipping."
          fi

  build:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            archive: tar.gz
          - os: linux
            arch: arm64
            archive: tar.gz
          - os: darwin
            arch: amd64
            archive: tar.gz
          - os: darwin
            arch: arm64
            archive: tar.gz
          - os: windows
            arch: amd64
            archive: zip
          # WINDOWS SHIPS NOW, and the exclusion that used to sit here is dead. It read "nothing
          # consumes a Windows artifact — the stack runs in WSL2 there, and the installer installs the
          # Linux binary into the distro", which stopped being true when the plane and the host
          # services became HOST processes: on Windows `orchicon install` / `orchicon serve` run a
          # NATIVE orchicon.exe, and WSL2 is left with only the runtime CONTAINERS, which need a Linux
          # kernel. The `.exe` branches below (build + package) stopped being inert the moment this
          # entry landed.
          #
          # windows/arm64 is deliberately NOT here: Windows on ARM runs the amd64 zip under emulation,
          # so a second ~60 MB artifact would be published for nobody. It IS compiled by `make
          # cross-compile` (Makefile CROSS_PLATFORMS), so an arm64 break fails the gate instead of
          # shipping. TestReleaseWorkflowPackagesTheWindowsZip asserts this wiring.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
          ORCHICON_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="${ORCHICON_VERSION}"
          LDFLAGS="-X github.com/beardedparrott/orchicon/internal/version.gitCommit=$(git rev-parse --short HEAD) \
                   -X github.com/beardedparrott/orchicon/internal/version.gitTag=${VERSION} \
                   -X github.com/beardedparrott/orchicon/internal/version.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EXT=""
          [ "${{ matrix.os }}" = "windows" ] && EXT=".exe"
          go build -ldflags "$LDFLAGS" -o "orchicon${EXT}" ./cmd/orchicon
          go build -ldflags "$LDFLAGS" -o "orch${EXT}" ./cmd/orch

      - name: Package
        env:
          ORCHICON_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="${ORCHICON_VERSION}"
          VERSION_NUM="${VERSION#v}"
          EXT=""
          [ "${{ matrix.os }}" = "windows" ] && EXT=".exe"
          ASSET="orchicon_${VERSION_NUM}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p "$ASSET"
          cp "orchicon${EXT}" "$ASSET/"
          cp "orch${EXT}" "$ASSET/"
          cp README.md "$ASSET/" 2>/dev/null || true
          cp LICENSE "$ASSET/" 2>/dev/null || true
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar -czf "${ASSET}.tar.gz" "$ASSET"
          else
            zip -r "${ASSET}.zip" "$ASSET"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: orchicon-${{ matrix.os }}-${{ matrix.arch }}
          path: orchicon_*

  # SIGNED + NOTARISED macOS ARTIFACTS — DORMANT UNTIL A CERTIFICATE EXISTS.
  #
  # WHY A JOB ON A macOS RUNNER RATHER THAN A FLAG ON `build`: `codesign` and `notarytool` are macOS-only,
  # and the `build` matrix cross-compiles darwin/amd64 and darwin/arm64 on ubuntu-latest — a binary produced
  # there CANNOT be code-signed. The `build` matrix is deliberately NOT given a macOS runner either: it also
  # builds the frontend and packages every platform, so duplicating it would double the release time to
  # sign two artifacts. Signing is therefore its own job, over the darwin artifacts `build` already made.
  #
  # PREREQUISITES — the cost of turning this on, stated here rather than in a wiki.
  #   * an Apple Developer Program membership, USD 99/yr. A "Developer ID Application" certificate cannot be
  #     issued without one, so this is the standing prerequisite rather than an optional extra; and
  #   * the certificate exported as a .p12  → secret    MACOS_CERT_P12_BASE64
  #   * that .p12's password                 → secret    MACOS_CERT_P12_PASSWORD
  #   * an app-specific password for the Apple ID used to notarise → secret MACOS_NOTARY_PASSWORD
  #   * repository VARIABLES (not secrets — none of them is sensitive)
  #       MACOS_SIGNING_ENABLED  = "true" to enable this job (anything else skips it)
  #       MACOS_SIGNING_IDENTITY = "Developer ID Application: Your Name (TEAMID)"
  #       MACOS_NOTARY_APPLE_ID  = the Apple ID that submits the notarisation
  #       MACOS_NOTARY_TEAM_ID   = the 10-character team id
  #
  # WHILE IT IS OFF the release ships unsigned archives, and the installers' guidance block is the support
  # story: the documented curl one-liner is Gatekeeper-clean because curl sets no quarantine bit, and a
  # BROWSER download needs the single-file `xattr -d com.apple.quarantine` command.
  #
  # TestMacOSSigningJobRunsOnAMacOSRunner pins the runner, so this job cannot silently become a cross-compile
  # on ubuntu-latest — which would report success while signing nothing.
  sign-macos:
    needs: [guard, build]
    if: needs.guard.outputs.proceed == 'true' && vars.MACOS_SIGNING_ENABLED == 'true'
    name: Sign + notarise macOS
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: orchicon-darwin-*
          path: unsigned

      - name: Import the Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
        run: |
          set -eo pipefail
          KEYCHAIN="$RUNNER_TEMP/orchicon-signing.keychain-db"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12" || \
            printf '%s' "$CERT_P12_BASE64" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign
          # WITHOUT THE PARTITION LIST codesign blocks on a keychain prompt and the job hangs on a
          # headless runner instead of failing.
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Sign, notarise and repackage
        env:
          IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ vars.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ vars.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          ORCHICON_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -eo pipefail
          cd unsigned
          for artifact in orchicon-darwin-*; do
            archive="$(find "$artifact" -maxdepth 1 -name '*.tar.gz' | head -1)"
            if [ -z "$archive" ]; then
              echo "::error::$artifact contains no .tar.gz"
              exit 1
            fi
            dir="$(basename "$archive" .tar.gz)"
            tar -xzf "$archive"
            for binary in "$dir/orchicon" "$dir/orch"; do
              [ -f "$binary" ] || continue
              codesign --force --options runtime --timestamp --sign "$IDENTITY" "$binary"
              codesign --verify --strict --verbose=2 "$binary"
            done
            # NOTARISE A .pkg, NOT THE TARBALL. A notarisation ticket is stapled to a bundle or an installer
            # package — never to a bare Mach-O CLI — so the artifact that can carry a stapled ticket has to be
            # one Gatekeeper inspects, which is the .pkg built here.
            pkg="${dir}.pkg"
            pkgbuild --root "$dir" --identifier "dev.orchicon.cli" --version "${ORCHICON_VERSION#v}" "$pkg"
            xcrun notarytool submit "$pkg" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" \
              --password "$NOTARY_PASSWORD" --wait
            xcrun stapler staple "$pkg"
            xcrun stapler validate "$pkg"
            # Re-create the tarball around the SIGNED binaries: this is the archive the installer downloads.
            rm -f "$archive"
            tar -czf "$archive" "$dir"
          done

      # STAGED FLAT INTO signed/, AND THAT IS LOAD-BEARING. `download-artifact` rebuilds an artifact's
      # directory tree from these paths, and the release job merges every artifact into ONE flat directory
      # and writes SHA256SUMS there from a non-recursive glob. A nested upload therefore leaves the release
      # holding two files of the same name: the UNSIGNED archive from `build` at the top level, and the
      # signed one in a subdirectory. The checksums, the `gh release` asset list and the installers would
      # then all resolve to the unsigned copy while this job reports success — a signing pipeline that
      # signs nothing, which is exactly the failure TestReleaseInstallsTheSignedMacOSArchivesOverTheUnsignedOnes
      # exists to prevent. `signed/*` keeps the signed archives at the artifact ROOT, where they belong.
      - name: Stage the signed archives
        run: |
          set -eo pipefail
          mkdir -p signed
          find unsigned -mindepth 2 -maxdepth 2 -type f \( -name '*.tar.gz' -o -name '*.pkg' \) \
            -exec mv {} signed/ \;
          ls -l signed

      - uses: actions/upload-artifact@v4
        with:
          name: orchicon-darwin-signed
          path: signed/*

  # Build + push the single-container image to GHCR. The image embeds the
  # frontend and ships every runtime (postgres, nats, tempo, loki, vm,
  # collector, opencode) with the orchicon binary as PID-1
  # supervisor (`orchicon container`). Tagged with the version + latest.
  # THE DESKTOP APP IS NOT A CROSS-COMPILE. It is CGO + a native webview (WebKitGTK / WKWebView /
  # WebView2), so it cannot be produced by the CGO_ENABLED=0 loop in the `build` job above and it is
  # deliberately NOT in the Makefile's CROSS_PLATFORMS list. Each OS builds its own binary on its own
  # runner (pinned by TestDesktopMatrixCoversLinuxMacOSWindows, TestReleaseBuildsDesktopAppPerOS and
  # TestDesktopNotInCrossPlatforms).
  #
  # THE FRONTEND BUILD MUST COME FIRST: `go:embed all:frontend/dist` matches the tracked
  # frontend/dist/.gitkeep when the bundle has not been built, so a misordered job compiles perfectly
  # and ships an app that opens an empty window. Asserted by TestDesktopJobBuildsFrontendBeforeBinary.
  #
  # AND THE `webkit2_41` TAG IS NOT OPTIONAL ON LINUX: Wails selects the WebKitGTK ABI by build tag
  # (`#cgo !webkit2_41 pkg-config: webkit2gtk-4.0` / `#cgo webkit2_41 pkg-config: webkit2gtk-4.1`).
  # Without it the cgo files demand webkit2gtk-4.0's pkg-config file, which no current Ubuntu ships —
  # the step below installs `libwebkit2gtk-4.1-dev`, so the tags and the package must agree. The tag is
  # inert on macOS (WKWebView) and Windows (WebView2). Asserted by TestReleaseBuildsDesktopAppPerOS.
  desktop:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install webview build dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build the SPA that the binary embeds
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run build
      - name: Install the Wails CLI
        run: |
          set -euo pipefail
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      # THE Wails CLI RESOLVES ITS PROJECT FROM THE WORKING DIRECTORY: `wails build` loads
      # `./wails.json` (wails/v2/internal/project.Load uses os.Getwd and has no project-dir
      # flag), and the project file lives in cmd/orchicon-desktop, not the repo root. Run
      # from the root and the step dies on a missing wails.json — which is why the working
      # directory is explicit rather than inherited. Asserted by
      # TestDesktopBuildRunsInTheWailsProjectDirectory.
      - name: Build the desktop app
        working-directory: cmd/orchicon-desktop
        run: |
          set -euo pipefail
          wails build -tags desktop,production,webkit2_41 -clean
      - uses: actions/upload-artifact@v4
        with:
          name: orchicon-desktop-${{ matrix.os }}
          path: |
            cmd/orchicon-desktop/build/bin/orchicon-desktop
            cmd/orchicon-desktop/build/bin/orchicon-desktop.exe
          if-no-files-found: error

  container:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Build binary
        env:
          ORCHICON_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          LDFLAGS="-X github.com/beardedparrott/orchicon/internal/version.gitCommit=$(git rev-parse --short HEAD) \
                   -X github.com/beardedparrott/orchicon/internal/version.gitTag=${ORCHICON_VERSION} \
                   -X github.com/beardedparrott/orchicon/internal/version.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -ldflags "$LDFLAGS" -o ./orchicon ./cmd/orchicon
          go build -ldflags "$LDFLAGS" -o ./orch ./cmd/orch

      - name: Build container image
        env:
          ORCHICON_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          cp ./orchicon deploy/container/orchicon
          cp ./orch deploy/container/orch
          docker build -f deploy/container/Dockerfile -t "ghcr.io/beardedparrott/orchicon:${ORCHICON_VERSION}" deploy/container
          docker tag "ghcr.io/beardedparrott/orchicon:${ORCHICON_VERSION}" ghcr.io/beardedparrott/orchicon:latest

      - name: Push container image
        env:
          ORCHICON_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -eo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/beardedparrott/orchicon:${ORCHICON_VERSION}"
          docker push ghcr.io/beardedparrott/orchicon:latest

      # Per-workflow runtime base image (one container per active workflow
      # run). Shipped to GHCR so a one-command install can pull it — the
      # runtime daemon uses it to spawn orchicon-runtime-<runID>. The
      # orchicon binary is NOT baked in (the daemon bind-mounts its own
      # executable at container-create time); the image content is a pure
      # function of the Dockerfiles, so the version-as-tag plus the
      # org.orchicon.runtime.version label identify the build inputs. The
      # :gui variant (headless GUI libs) is built FROM the base so the label
      # + chown model are inherited.
      - name: Build runtime image
        env:
          ORCHICON_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          docker build --label "org.orchicon.runtime.version=${ORCHICON_VERSION}" -f deploy/runtime/Dockerfile -t "ghcr.io/beardedparrott/orchicon-runtime:${ORCHICON_VERSION}" deploy/runtime
          docker tag "ghcr.io/beardedparrott/orchicon-runtime:${ORCHICON_VERSION}" ghcr.io/beardedparrott/orchicon-runtime:latest
          docker build --label "org.orchicon.runtime.version=${ORCHICON_VERSION}-gui" --build-arg "BASE_IMAGE=ghcr.io/beardedparrott/orchicon-runtime:${ORCHICON_VERSION}" -f deploy/runtime/Dockerfile.gui -t "ghcr.io/beardedparrott/orchicon-runtime:gui-${ORCHICON_VERSION}" deploy/runtime
          docker tag "ghcr.io/beardedparrott/orchicon-runtime:gui-${ORCHICON_VERSION}" ghcr.io/beardedparrott/orchicon-runtime:gui
          docker build --label "org.orchicon.runtime.version=${ORCHICON_VERSION}-dev" --build-arg "BASE_IMAGE=ghcr.io/beardedparrott/orchicon-runtime:${ORCHICON_VERSION}" -f deploy/runtime/Dockerfile.dev -t "ghcr.io/beardedparrott/orchicon-runtime:dev-${ORCHICON_VERSION}" deploy/runtime
          docker tag "ghcr.io/beardedparrott/orchicon-runtime:dev-${ORCHICON_VERSION}" ghcr.io/beardedparrott/orchicon-runtime:dev

      - name: Push runtime image
        env:
          ORCHICON_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -eo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/beardedparrott/orchicon-runtime:${ORCHICON_VERSION}"
          docker push ghcr.io/beardedparrott/orchicon-runtime:latest
          docker push "ghcr.io/beardedparrott/orchicon-runtime:gui-${ORCHICON_VERSION}"
          docker push ghcr.io/beardedparrott/orchicon-runtime:gui
          docker push "ghcr.io/beardedparrott/orchicon-runtime:dev-${ORCHICON_VERSION}"
          docker push ghcr.io/beardedparrott/orchicon-runtime:dev

  release:
    name: Create Release
    needs: [build, guard, sign-macos]
    # `sign-macos` IS IN `needs` so the signed archives are the ones downloaded — but it is SKIPPED while
    # signing is off, and a skipped dependency skips its dependents. Hence the explicit `skipped` arm: the
    # release must go ahead on an unsigned build, which is the normal case today.
    if: |
      needs.guard.outputs.proceed == 'true' &&
      (needs.sign-macos.result == 'success' || needs.sign-macos.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # THE SIGNED MACOS ARCHIVES, DOWNLOADED SECOND AND ON PURPOSE.
      #
      # The step above merges EVERY artifact into one flat directory, so the signed archives carry the same
      # file names as the unsigned ones `build` uploaded and the order in which artifacts are merged is not
      # specified. Downloading this artifact afterwards makes the signed files the ones on disk — by
      # construction rather than by luck — so the SHA256SUMS generated below, the published assets and every
      # installed binary are the signed ones. `if:` scopes it to a run where signing actually happened; when
      # the sign job is skipped (the normal case today) there is no such artifact and nothing to download.
      - name: Download the signed macOS archives last, so they are the ones that stay
        if: needs.sign-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: orchicon-darwin-signed

      # THE CHECKSUMS THE INSTALLERS VERIFY. `merge-multiple: true` above flattens every artifact into
      # artifacts/, so this is a flat directory and the sums are written flat beside the archives.
      #
      # GENERATING THIS FILE IS ONLY HALF THE JOB: the upload manifest is the `find` in the next step, so a
      # checksum file that is generated here and not listed there is published to nobody. Both halves are
      # asserted by TestReleasePublishesChecksums.
      - name: Generate checksums
        working-directory: artifacts
        run: |
          set -eo pipefail
          shopt -s nullglob
          files=( *.tar.gz *.pkg )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no archives under artifacts/ to checksum"
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          VERSION="${{ inputs.version || github.ref_name }}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version tag (no input, no ref_name)"
            exit 1
          fi
          # Ensure the tag exists locally and points at HEAD — the
          # auto-release workflow creates the tag in its own job, but
          # manual dispatches (workflow_dispatch) don't always have
          # fetch-tags: true for tags created in a separate run. Pull
          # the tag from origin if we don't have it, or recreate it
          # pointing at the merge commit.
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} not found locally; fetching from origin"
            git fetch --tags origin
          fi
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} does not exist on origin either"
            exit 1
          fi
          # Create the release. The body is the curated narrative from
          # RELEASE_HIGHLIGHTS.md (scripts/gen-release-notes.sh) — the
          # reader-facing story, NOT the itemized UPDATES.md rows (those are
          # the internal engineering track record; README carries a compact
          # digest). The script finds the previous release via the
          # Releases API; the current release does not exist yet, so it
          # resolves to the prior one.
          #
          # We use `gh release create` directly (not softprops/action-gh-
          # release) for the same reasons as before: explicit retry behavior
          # and clearer errors than the action wrapper under load.
          # SHA256SUMS IS IN THIS LIST ON PURPOSE — this find IS the upload manifest, so an asset that is
          # not named here is silently not published, however carefully it was produced.
          ASSETS=$(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.pkg' -o -name 'SHA256SUMS' \) | sort)
          if [ -z "$ASSETS" ]; then
            echo "::error::No release assets found under artifacts/"
            exit 1
          fi
          echo "Uploading ${ASSETS} to release ${VERSION}"
          # Delete any pre-existing release for this tag (stale partial
          # releases from earlier failed runs would otherwise 422 the
          # create call).
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists — deleting before re-create"
            gh release delete "${VERSION}" --yes
          fi
          # (AGENTS.md: README's "Last Release Changes" is the compact
          # digest of the same story, and UPDATES.md is trimmed to the
          # current cycle on the next develop merge).
          RELEASE_NOTES="$(bash scripts/gen-release-notes.sh "${VERSION}")"
          if [ -n "${RELEASE_NOTES}" ]; then
            NOTES_FILE="$(mktemp)"
            printf '%s\n' "${RELEASE_NOTES}" > "${NOTES_FILE}"
            NOTES_ARGS=(--notes-file "${NOTES_FILE}")
          else
            NOTES_ARGS=(--notes "No release highlights found (RELEASE_HIGHLIGHTS.md has no cycle section).")
          fi
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            "${NOTES_ARGS[@]}" \
            --draft=false \
            $ASSETS
          echo "Release ${VERSION} created with $(echo "$ASSETS" | wc -l) assets"

      - name: Dispatch release pruning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A release created here via GITHUB_TOKEN does not fire a
          # `release: published` event (recursive-trigger limitation),
          # so dispatch the prune workflow explicitly to enforce the cap.
          gh workflow run prune-releases.yml --ref "${{ github.event.repository.default_branch }}"
